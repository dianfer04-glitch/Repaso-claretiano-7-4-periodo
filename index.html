{id:"len",name:"Castellano",c:"--lang",soft:"--lang-soft",desc:"Periodo IV (16 sep – 20 nov) · Profe Deicy Medina. Las evaluaciones son tipo Saber: lee bien y justifica tu respuesta.",topics:[
{id:"dramatico",name:"El género dramático",desc:"Obras para representar en teatro: diálogo, acotaciones, actos, escenas y subgéneros.",
exp:`<h3>¿Qué es?</h3><p>El <b>género dramático</b> reúne las obras escritas para ser <b>representadas</b> por actores en un escenario. La historia no la cuenta un narrador: avanza por lo que dicen y hacen los personajes.</p>
<div class="xcards">
<div class="xc"><b>Diálogo</b><span>Lo que hablan los personajes. Antes de cada parlamento va el nombre de quien habla.</span></div>
<div class="xc"><b>Acotaciones</b><span>Indicaciones del autor, casi siempre entre paréntesis: gestos, movimientos, tono, escenario.</span><i>(Entra corriendo, asustada.)</i></div>
<div class="xc"><b>Actos y escenas</b><span>El acto es una parte grande de la obra. La escena cambia cuando entra o sale un personaje.</span></div>
<div class="xc"><b>Conflicto</b><span>El problema que enfrenta a los personajes y mueve la historia.</span></div></div>
<h3>Subgéneros</h3>
<div class="xt"><table><thead><tr><th>Subgénero</th><th>Cómo es</th></tr></thead><tbody>
<tr><td><b>Tragedia</b></td><td>Conflictos graves y final triste o fatal.</td></tr>
<tr><td><b>Comedia</b></td><td>Situaciones de humor y final feliz.</td></tr>
<tr><td><b>Drama</b></td><td>Mezcla momentos serios y alegres, como la vida real.</td></tr>
</tbody></table></div>
<h3>Para montar la obra</h3><p>Se necesitan actores, director, escenografía, vestuario, iluminación y sonido.</p>
<div class="tip"><b>Ejemplo:</b><br>DOÑA ROSA: (Mirando por la ventana.) ¿Oíste eso, Julián?<br>JULIÁN: (Sin levantar la cabeza.) Es el viento, mamá.<br>Lo que está entre paréntesis son <b>acotaciones</b>; lo demás es <b>diálogo</b>.</div>`,
qs:[
{q:"¿Qué caracteriza a las obras del género dramático?",o:["Están escritas para ser representadas por actores","Están escritas en verso para expresar sentimientos","Las cuenta siempre un narrador","Solo se leen en silencio"],h:"Piensa en el teatro.",e:"Las obras dramáticas se escriben para representarse en un escenario."},
{q:"En una obra de teatro, las indicaciones que da el autor sobre gestos, movimientos o el escenario se llaman:",o:["Acotaciones","Diálogos","Estrofas","Párrafos"],h:"Casi siempre van entre paréntesis.",e:"Las acotaciones orientan a actores y director sobre cómo representar la obra."},
{q:"En «JULIÁN: (Sin levantar la cabeza.) Es el viento, mamá», ¿qué parte es la acotación?",o:["(Sin levantar la cabeza.)","JULIÁN","Es el viento, mamá","mamá"],h:"Busca lo que está entre paréntesis.",e:"La acotación indica cómo actúa el personaje: sin levantar la cabeza."},
{q:"¿Cómo avanza la historia en una obra dramática?",o:["Por medio del diálogo y las acciones de los personajes","Por lo que cuenta un narrador","Por las rimas de los versos","Por las imágenes del libro"],h:"En el teatro no hay narrador.",e:"El diálogo y la acción de los personajes cuentan la historia."},
{q:"Una obra con situaciones de humor y final feliz es una:",o:["Comedia","Tragedia","Biografía","Fábula"],h:"Te hace reír.",e:"La comedia usa el humor y termina bien."},
{q:"Una obra con conflictos graves y un final triste o fatal es una:",o:["Tragedia","Comedia","Publicidad","Autobiografía"],h:"Es lo contrario de la comedia.",e:"La tragedia termina mal para los protagonistas."},
{q:"¿Cuándo cambia una escena en el teatro?",o:["Cuando entra o sale un personaje","Cuando termina la obra","Cuando el público aplaude","Cuando un personaje habla"],h:"Tiene que ver con quién está en el escenario.",e:"Una escena nueva empieza cuando cambian los personajes presentes."}],
open:[
{q:"Escribe un diálogo corto (3 parlamentos) entre dos personajes que incluya al menos dos acotaciones.",a:"Ejemplo: MARÍA: (Entrando con prisa.) ¡Se va el bus para Garzón! / PEDRO: (Buscando la maleta.) ¡Espérame un segundo! / MARÍA: (Mirando el reloj.) No hay tiempo. Vale cualquier diálogo con nombres de personajes y acotaciones entre paréntesis."},
{q:"Explica la diferencia entre tragedia y comedia.",a:"La tragedia presenta conflictos graves y termina con un final triste o fatal. La comedia presenta situaciones de humor y termina con un final feliz."},
{q:"¿Para qué sirven las acotaciones en una obra de teatro?",a:"Para indicar a los actores y al director cómo deben actuar (gestos, movimientos, tono de voz) y cómo es el escenario."}]},
{id:"variantes",name:"Variantes lingüísticas",desc:"Formas distintas de hablar el mismo idioma según la región, el grupo social, la situación y la época.",
exp:`<h3>¿Qué son?</h3><p>Son las diferentes <b>formas de usar una misma lengua</b>. Todos hablamos español, pero no lo hablamos igual: depende de dónde somos, con quién hablamos y en qué situación estamos.</p>
<div class="xt"><table><thead><tr><th>Variante</th><th>Depende de…</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Geográfica</b> (diatópica)</td><td>La región donde se vive</td><td>El acento opita, paisa, costeño o rolo. Al bus le dicen «buseta», «chiva» o «colectivo» según la región.</td></tr>
<tr><td><b>Social</b> (diastrática)</td><td>El grupo social, la edad o la profesión</td><td>La jerga de los jóvenes («parce», «bacano») o el vocabulario de los médicos.</td></tr>
<tr><td><b>Situacional</b> (diafásica)</td><td>La situación comunicativa</td><td>Formal con la rectora: «Buenos días, ¿cómo está usted?». Informal con amigos: «¡Quiubo! ¿Qué más?».</td></tr>
<tr><td><b>Histórica</b> (diacrónica)</td><td>La época</td><td>Antes se decía «vuestra merced»; hoy decimos «usted».</td></tr>
</tbody></table></div>
<p>Las formas regionales de hablar se llaman <b>dialectos</b>. Ningún dialecto es mejor que otro.</p>
<div class="tip"><b>Truco:</b> pregúntate <b>dónde</b> (geográfica), <b>quién</b> (social), <b>en qué situación</b> (situacional) o <b>cuándo</b> (histórica).</div>`,
qs:[
{q:"¿Qué son las variantes lingüísticas?",o:["Las diferentes formas de usar una misma lengua","Los distintos idiomas del mundo","Los errores de ortografía","Las reglas de la gramática"],h:"Todos hablamos español, pero no igual.",e:"Son las formas en que cambia una lengua según región, grupo social, situación o época."},
{q:"Una persona de Neiva y una de Medellín hablan español con acentos y palabras distintas. ¿Qué variante es?",o:["Geográfica","Histórica","Situacional","Social"],h:"La diferencia está en dónde viven.",e:"La variante geográfica depende de la región."},
{q:"Sofía le dice a su amiga «¡Quiubo, qué más!», pero a la rectora le dice «Buenos días, ¿cómo está usted?». ¿Qué variante usa?",o:["Situacional","Geográfica","Histórica","Dialecto"],h:"Es la misma persona hablando en dos momentos distintos.",e:"Cambia su forma de hablar según la situación: formal o informal."},
{q:"Los jóvenes usan palabras como «parce» o «bacano» que los abuelos casi no usan. ¿Qué variante es?",o:["Social","Histórica","Geográfica","Situacional"],h:"Depende del grupo (la edad).",e:"La variante social depende del grupo, la edad o la profesión."},
{q:"Antes se decía «vuestra merced» y hoy decimos «usted». ¿Qué variante muestra esto?",o:["Histórica","Social","Situacional","Geográfica"],h:"¿Qué cambió? La época.",e:"La variante histórica muestra cómo cambia la lengua con el tiempo."},
{q:"Las formas de hablar propias de una región se llaman:",o:["Dialectos","Idiomas","Acotaciones","Conectores"],h:"El opita y el paisa son ejemplos.",e:"Los dialectos son las variantes de una lengua en una región."},
{q:"¿Cuál de estas afirmaciones es correcta?",o:["Ningún dialecto es mejor que otro","El dialecto de la capital es el único correcto","Hablar con acento es un error","Las variantes solo existen en el español"],h:"Piensa en el respeto por la forma de hablar de los demás.",e:"Todas las variantes son válidas; lo importante es adecuarse a la situación."}],
open:[
{q:"Escribe cómo saludarías a tu mejor amiga y cómo saludarías al rector. ¿Qué variante lingüística estás usando?",a:"Ejemplo: amiga «¡Hola, ¿qué más?!»; rector «Buenos días, señor rector, ¿cómo está?». Es la variante situacional (o diafásica): cambia según la situación formal o informal."},
{q:"Escribe dos palabras o expresiones que se usen en el Huila y explica qué variante lingüística representan.",a:"Respuesta libre (por ejemplo, expresiones de la región para saludar o referirse a comidas típicas). Representan la variante geográfica o diatópica, porque dependen de la región."},
{q:"Explica con tus palabras qué es la variante histórica y da un ejemplo.",a:"Es el cambio de la lengua a través del tiempo. Ejemplo: antes se decía «vuestra merced» y hoy «usted»."}]},
{id:"conectores",name:"Conectores",desc:"Palabras que unen ideas: adición, contraste, causa, consecuencia, orden y conclusión.",
exp:`<h3>¿Qué son?</h3><p>Los <b>conectores</b> son palabras o expresiones que <b>unen ideas</b> y muestran la relación entre ellas. Hacen que un texto sea claro y ordenado.</p>
<div class="xt"><table><thead><tr><th>Tipo</th><th>Para qué sirve</th><th>Conectores</th></tr></thead><tbody>
<tr><td><b>Adición</b></td><td>Sumar una idea</td><td>y, además, también, asimismo</td></tr>
<tr><td><b>Contraste</b></td><td>Oponer ideas</td><td>pero, sin embargo, aunque, en cambio</td></tr>
<tr><td><b>Causa</b></td><td>Decir el porqué</td><td>porque, ya que, puesto que</td></tr>
<tr><td><b>Consecuencia</b></td><td>Decir el resultado</td><td>por lo tanto, por eso, así que</td></tr>
<tr><td><b>Orden o tiempo</b></td><td>Organizar pasos</td><td>primero, luego, después, finalmente</td></tr>
<tr><td><b>Ejemplificación</b></td><td>Dar ejemplos</td><td>por ejemplo, es decir</td></tr>
<tr><td><b>Conclusión</b></td><td>Cerrar</td><td>en conclusión, en resumen, en síntesis</td></tr>
</tbody></table></div>
<div class="tip"><b>Causa o consecuencia:</b> «No fui al río <u>porque</u> llovió» (causa: la lluvia). «Llovió, <u>por eso</u> no fui al río» (consecuencia: no fui).</div>`,
qs:[
{q:"¿Para qué sirven los conectores?",o:["Para unir ideas y mostrar la relación entre ellas","Para separar sílabas","Para marcar la tilde","Para indicar gestos en el teatro"],h:"Su nombre lo dice: conectan.",e:"Unen oraciones e ideas y dan coherencia al texto."},
{q:"«Quería ir al Desierto de la Tatacoa, ______ estaba lloviendo.» ¿Qué conector va?",o:["pero","porque","además","por ejemplo"],h:"Las dos ideas se oponen.",e:"«Pero» es de contraste: une ideas opuestas."},
{q:"«No fui al colegio ______ estaba enfermo.» ¿Qué conector va?",o:["porque","sin embargo","finalmente","además"],h:"La segunda parte explica el porqué.",e:"«Porque» es un conector de causa."},
{q:"«Estudié toda la semana; ______, me fue bien en el examen.» ¿Qué conector va?",o:["por lo tanto","aunque","primero","en cambio"],h:"Lo segundo es el resultado de lo primero.",e:"«Por lo tanto» es de consecuencia."},
{q:"El conector «sin embargo» es de tipo:",o:["Contraste","Adición","Causa","Orden"],h:"Es parecido a «pero».",e:"«Sin embargo» opone ideas, igual que «pero»."},
{q:"¿Cuál de estos conectores sirve para ordenar los pasos de una receta?",o:["Primero","Aunque","Porque","En cambio"],h:"Piensa en cómo explicas una receta de bizcochos de achira.",e:"«Primero, luego, después, finalmente» ordenan pasos."},
{q:"«En conclusión» es un conector que se usa:",o:["Al final, para cerrar o resumir","Al principio, para saludar","Para dar un ejemplo","Para oponer dos ideas"],h:"La palabra «conclusión» te da la pista.",e:"Los conectores de conclusión cierran el texto."}],
open:[
{q:"Une estas dos oraciones con un conector de contraste: «Me gusta el fútbol.» «No juego muy bien.»",a:"Ejemplo: Me gusta el fútbol, pero no juego muy bien. (También sirven «sin embargo» o «aunque».)"},
{q:"Escribe una oración con un conector de causa y otra con un conector de consecuencia.",a:"Ejemplo: Llegué tarde porque el bus se varó (causa). El bus se varó; por eso llegué tarde (consecuencia)."},
{q:"Escribe en 3 pasos cómo te alistas para ir al colegio, usando conectores de orden.",a:"Ejemplo: Primero me baño. Luego me pongo el uniforme y desayuno. Finalmente, reviso la maleta y salgo."}]},
{id:"puntuacion",name:"Signos de puntuación y tilde diacrítica",desc:"Punto, coma, punto y coma, dos puntos, comillas, signos de pregunta y exclamación, y tilde diacrítica.",
exp:`<h3>Signos de puntuación</h3>
<div class="xt"><table><thead><tr><th>Signo</th><th>Se usa para…</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Punto (.)</b></td><td>Seguido: dentro del párrafo. Aparte: cambia de párrafo. Final: termina el texto.</td><td>Llovió. Nos quedamos en casa.</td></tr>
<tr><td><b>Coma (,)</b></td><td>Separar elementos de una enumeración, llamar a alguien (vocativo) o encerrar una explicación.</td><td>Compré arroz, papa y plátano. / Laura, ven acá.</td></tr>
<tr><td><b>Punto y coma (;)</b></td><td>Separar ideas relacionadas o antes de «sin embargo», «por lo tanto».</td><td>Estudió mucho; por eso ganó.</td></tr>
<tr><td><b>Dos puntos (:)</b></td><td>Antes de una enumeración, de una cita y después del saludo de una carta.</td><td>Traje tres cosas: lápiz, borrador y regla.</td></tr>
<tr><td><b>Comillas (« »)</b></td><td>Citar palabras exactas de alguien.</td><td>La profe dijo: «Lean el capítulo dos».</td></tr>
<tr><td><b>¿? y ¡!</b></td><td>Preguntas y exclamaciones. En español se abren y se cierran.</td><td>¿Vienes? ¡Qué alegría!</td></tr>
</tbody></table></div>
<h3>Tilde diacrítica</h3><p>Es la tilde que <b>diferencia palabras que se escriben igual</b> pero significan distinto.</p>
<div class="xt"><table><thead><tr><th>Con tilde</th><th>Sin tilde</th></tr></thead><tbody>
<tr><td><b>él</b> (persona): Él llegó.</td><td><b>el</b> (artículo): el perro</td></tr>
<tr><td><b>tú</b> (persona): Tú ganaste.</td><td><b>tu</b> (de ti): tu cuaderno</td></tr>
<tr><td><b>mí</b> (persona): Es para mí.</td><td><b>mi</b> (de mí): mi casa</td></tr>
<tr><td><b>sí</b> (afirmación): Sí quiero.</td><td><b>si</b> (condición): si llueve…</td></tr>
<tr><td><b>té</b> (bebida): un té caliente</td><td><b>te</b> (pronombre): te quiero</td></tr>
<tr><td><b>más</b> (cantidad): quiero más</td><td><b>mas</b> (= pero)</td></tr>
<tr><td><b>qué, cómo, dónde</b> (pregunta o exclamación)</td><td><b>que, como, donde</b> (sin pregunta)</td></tr>
</tbody></table></div>
<div class="tip"><b>Truco:</b> si puedes cambiar «tu» por «tuyo» («el cuaderno tuyo»), va sin tilde. Si es la persona («tú»), lleva tilde.</div>`,
qs:[
{q:"¿Qué signo se usa para separar los elementos de una enumeración?",o:["La coma","El punto final","Las comillas","Los signos de exclamación"],h:"Arroz__ papa__ plátano.",e:"La coma separa los elementos de una lista."},
{q:"¿Qué signo va antes de una enumeración, como en «Traje tres cosas__ lápiz, borrador y regla»?",o:["Dos puntos","Punto y coma","Coma","Comillas"],h:"Anuncia lo que viene.",e:"Los dos puntos introducen una enumeración."},
{q:"¿Cuál oración está bien puntuada?",o:["¿Vas a ir al Malecón del río Magdalena?","Vas a ir al Malecón del río Magdalena?","¿Vas a ir al Malecón del río Magdalena","Vas a ir? al Malecón del río Magdalena"],h:"En español la pregunta se abre y se cierra.",e:"Los signos de interrogación van al inicio y al final de la pregunta."},
{q:"En «Laura, ven a almorzar», ¿para qué se usa la coma?",o:["Para separar el nombre de la persona a quien se llama (vocativo)","Para enumerar","Para cerrar una pregunta","Para citar palabras"],h:"Laura es a quien le hablan.",e:"El vocativo (nombre de a quien se llama) se separa con coma."},
{q:"¿Cuál oración usa bien la tilde diacrítica?",o:["Tú traes tu cuaderno.","Tu traes tú cuaderno.","Tú traes tú cuaderno.","Tu traes tu cuaderno."],h:"«Tú» es la persona; «tu» es de quién es el cuaderno.",e:"Tú (persona) lleva tilde; tu (posesivo) no."},
{q:"Completa: «______ llueve, no iremos al río.»",o:["Si","Sí","Sé","Se"],h:"Es una condición, no una afirmación.",e:"«Si» sin tilde expresa condición. «Sí» con tilde es afirmación."},
{q:"¿Cuál oración está bien escrita?",o:["Él me regaló el libro.","El me regaló él libro.","Él me regaló él libro.","El me regaló el libro."],h:"¿Quién regaló? Una persona.",e:"Él (persona) lleva tilde; el (artículo, antes de libro) no."}],
open:[
{q:"Puntúa correctamente: «mamá dijo traigan arroz papa y plátano para el sancocho»",a:"Mamá dijo: «Traigan arroz, papa y plátano para el sancocho»."},
{q:"Escribe una oración con «mí» (con tilde) y otra con «mi» (sin tilde).",a:"Ejemplo: Ese regalo es para mí. / Mi perro se llama Toby."},
{q:"Explica qué es la tilde diacrítica y da un ejemplo.",a:"Es la tilde que diferencia palabras que se escriben igual pero tienen distinto significado o función. Ejemplo: «sí» (afirmación) y «si» (condición)."}]},
{id:"biografia",name:"Biografía y autobiografía",desc:"Contar la vida de una persona: quién la narra, en qué persona y con qué estructura.",
exp:`<h3>Diferencia clave</h3>
<div class="xcards">
<div class="xc"><b>Biografía</b><span>Otra persona cuenta la vida de alguien. Se escribe en <u>tercera persona</u> (él, ella).</span><i>«José Eustasio Rivera nació en 1888…»</i></div>
<div class="xc"><b>Autobiografía</b><span>La persona cuenta su propia vida. Se escribe en <u>primera persona</u> (yo).</span><i>«Yo nací en Neiva en 2013…»</i></div></div>
<p class="small">«Auto» significa «uno mismo», como en autorretrato.</p>
<h3>Estructura (orden cronológico)</h3><p>1. Nacimiento: fecha, lugar, familia. 2. Infancia y estudios. 3. Hechos importantes y logros. 4. Presente, o muerte y legado.</p>
<h3>Ejemplo del Huila</h3><p><b>José Eustasio Rivera</b> nació en 1888 en el Huila, en el municipio que hoy lleva su nombre (Rivera). Fue abogado, poeta y novelista. En 1924 publicó <i>La vorágine</i>, una de las novelas más importantes de Colombia, que denuncia la explotación de los caucheros en la selva. Murió en Nueva York en 1928.</p>
<div class="tip"><b>Para escribir una biografía:</b> busca datos verdaderos, ordénalos por fechas y usa conectores de tiempo (primero, años después, finalmente).</div>`,
qs:[
{q:"¿Qué es una biografía?",o:["La historia de la vida de una persona contada por otra","La historia de la vida que cuenta la misma persona","Un cuento inventado","Una obra de teatro"],h:"Alguien escribe sobre la vida de otro.",e:"En la biografía otra persona narra la vida de alguien."},
{q:"¿En qué persona gramatical se escribe una autobiografía?",o:["Primera persona (yo)","Tercera persona (él, ella)","Segunda persona (tú)","No usa personas"],h:"La persona cuenta su propia vida.",e:"En la autobiografía el autor habla de sí mismo: «yo»."},
{q:"«Nací en Neiva un martes de lluvia. Mis papás cuentan que…» Este texto es:",o:["Una autobiografía","Una biografía","Una propaganda","Una obra dramática"],h:"Mira las palabras «nací» y «mis».",e:"Está en primera persona: es autobiografía."},
{q:"¿En qué orden se presentan normalmente los hechos de una biografía?",o:["Cronológico: del nacimiento al presente o la muerte","Del más importante al menos importante","En orden alfabético","Al azar"],h:"Piensa en una línea de tiempo.",e:"Se siguen las fechas en orden: orden cronológico."},
{q:"¿Qué escribió José Eustasio Rivera, escritor nacido en el Huila?",o:["La vorágine","Cien años de soledad","María","El coronel no tiene quien le escriba"],h:"Es una novela sobre la selva y los caucheros.",e:"Rivera escribió La vorágine (1924)."},
{q:"El prefijo «auto» de autobiografía significa:",o:["Uno mismo","Carro","Otro","Antiguo"],h:"Como en «autorretrato».",e:"Auto = uno mismo."},
{q:"¿Cuál de estos datos NO debería ir en una biografía?",o:["Hechos inventados para que sea más emocionante","La fecha y el lugar de nacimiento","Sus estudios","Sus logros más importantes"],h:"La biografía cuenta una vida real.",e:"La biografía se basa en hechos reales y verificables."}],
open:[
{q:"Escribe el inicio de tu autobiografía en 3 o 4 líneas (nacimiento, familia y algo de tu infancia).",a:"Ejemplo: Nací en Neiva, Huila. Vivo con mi papá y mi familia. Cuando era pequeña me gustaba… Debe estar en primera persona y en orden cronológico."},
{q:"Explica dos diferencias entre biografía y autobiografía.",a:"1) La biografía la escribe otra persona y la autobiografía la persona misma. 2) La biografía va en tercera persona y la autobiografía en primera persona."},
{q:"Convierte esta frase de autobiografía en biografía: «Nací en Neiva y estudié en el Colegio Claretiano».",a:"Ella (o el nombre) nació en Neiva y estudió en el Colegio Claretiano."}]},
{id:"publicidad",name:"Publicidad y propaganda",desc:"Textos que buscan convencer: vender un producto o difundir una idea.",
exp:`<h3>La diferencia</h3>
<div class="xcards">
<div class="xc"><b>Publicidad</b><span>Busca <u>vender</u> un producto o servicio. Tiene fin comercial.</span><i>«Bizcochos de achira Doña Tere: ¡el sabor del Huila!»</i></div>
<div class="xc"><b>Propaganda</b><span>Busca <u>difundir una idea</u>, un valor o una causa (social, política, religiosa). No vende nada.</span><i>«Cuida el río Las Ceibas: no botes basura.»</i></div></div>
<h3>Elementos de un anuncio</h3><p><b>Eslogan</b> (frase corta y fácil de recordar) · <b>imagen</b> · <b>logotipo</b> · <b>texto</b> que explica · <b>público objetivo</b> (a quién va dirigido).</p>
<h3>Estrategias para convencer</h3><p>Despertar emociones · usar a un personaje famoso · humor · repetición · prometer beneficios («más rápido», «más rico»).</p>
<div class="tip"><b>Lectura crítica:</b> pregúntate siempre qué quiere que hagas el anuncio y si lo que promete es verdad.</div>`,
qs:[
{q:"¿Cuál es el propósito principal de la publicidad?",o:["Vender un producto o servicio","Difundir una idea sin vender nada","Contar la vida de alguien","Representar una obra de teatro"],h:"Tiene fin comercial.",e:"La publicidad busca que compremos algo."},
{q:"¿Cuál es el propósito principal de la propaganda?",o:["Difundir ideas, valores o causas","Vender celulares","Narrar un cuento","Enseñar ortografía"],h:"No vende, convence de una idea.",e:"La propaganda promueve ideas sociales, políticas o religiosas."},
{q:"«Cuida el río Las Ceibas: no botes basura.» Este mensaje es:",o:["Propaganda","Publicidad","Biografía","Acotación"],h:"¿Te está vendiendo algo?",e:"Promueve una idea (cuidar el río), no un producto: es propaganda."},
{q:"«Bizcochos de achira Doña Tere: ¡el sabor del Huila!» Este mensaje es:",o:["Publicidad","Propaganda","Texto propositivo","Autobiografía"],h:"Están ofreciendo un producto.",e:"Busca vender bizcochos: es publicidad."},

{q:"Un anuncio de zapatos deportivos muestra a un futbolista famoso usándolos. ¿Qué estrategia usa?",o:["Personaje famoso","Humor","Repetición","Ninguna"],h:"¿Por qué aparece esa persona?",e:"Usa la fama del deportista para que queramos imitarlo y comprar."},
{q:"Una campaña dice: «Vacúnate. Protege a tu familia». ¿Qué tipo de texto es?",o:["Propaganda","Publicidad","Biografía","Obra dramática"],h:"Promueve una acción por el bien común.",e:"Es propaganda: difunde una idea de salud pública."}],

{id:"propositivo",name:"El texto propositivo",desc:"Textos que presentan un problema y proponen soluciones con argumentos.",
exp:`<h3>¿Qué es?</h3><p>Un <b>texto propositivo</b> es aquel en el que el autor presenta un <b>problema</b> y <b>propone una o varias soluciones</b>, explicando con <b>argumentos</b> por qué funcionarían.</p>
<h3>Estructura</h3><div class="chain"><span class="ln">Problema<small>¿Qué pasa?</small></span><span class="ar">→</span><span class="ln">Propuesta<small>¿Qué hacer?</small></span><span class="ar">→</span><span class="ln">Argumentos<small>¿Por qué sirve?</small></span><span class="ar">→</span><span class="ln sun">Conclusión<small>Cierre</small></span></div>
<h3>Ejemplo</h3><p><i>En los descansos el colegio queda lleno de basura (problema). Propongo instalar canecas de colores para reciclar en cada pasillo y que cada curso se turne para vigilarlas (propuesta). Así el colegio estará limpio y aprenderemos a separar residuos, ya que los estudiantes cuidan más lo que sienten como suyo (argumentos). En conclusión, con canecas y compromiso de todos podemos tener un colegio limpio (conclusión).</i></p>
<div class="tip"><b>Ojo:</b> una propuesta sin argumentos es solo una opinión. Usa conectores de causa («porque», «ya que») para justificar.</div>`,
qs:[
{q:"¿Cuál es el propósito de un texto propositivo?",o:["Presentar un problema y proponer soluciones argumentadas","Vender un producto","Contar la vida de una persona","Describir un paisaje"],h:"Su nombre viene de «proponer».",e:"Plantea un problema y propone cómo solucionarlo, con argumentos."},
{q:"¿Cuál es el orden de la estructura de un texto propositivo?",o:["Problema, propuesta, argumentos y conclusión","Conclusión, problema, propuesta y saludo","Inicio, nudo y desenlace","Nacimiento, estudios y logros"],h:"Primero hay que saber qué pasa.",e:"Problema → propuesta → argumentos → conclusión."},
{q:"«Propongo instalar canecas de reciclaje en cada pasillo.» Esta oración corresponde a:",o:["La propuesta","El problema","La conclusión","Una acotación"],h:"Mira el verbo «propongo».",e:"Es la solución que se plantea: la propuesta."},
{q:"¿Qué hace más fuerte una propuesta?",o:["Los argumentos que explican por qué funcionaría","Escribirla en mayúsculas","Repetirla muchas veces sin explicar","Que sea muy corta"],h:"¿Qué convence a quien lee?",e:"Los argumentos justifican la propuesta y convencen al lector."},
{q:"¿Cuál de estas oraciones es un argumento?",o:["Porque los estudiantes cuidan más lo que sienten como suyo","Hay mucha basura en el patio","En conclusión, cuidemos el colegio","Propongo poner canecas"],h:"Un argumento explica el porqué.",e:"Empieza con «porque» y justifica la propuesta."},
{q:"«En los descansos el colegio queda lleno de basura.» Esta oración es:",o:["El problema","La propuesta","El argumento","La conclusión"],h:"Describe lo que está mal.",e:"Presenta la situación que hay que resolver: el problema."},
{q:"¿Qué conector es útil para introducir la conclusión de un texto propositivo?",o:["En conclusión","Porque","Primero","Pero"],h:"Va al final del texto.",e:"«En conclusión» cierra el texto."}],
open:[
{q:"Identifica un problema de tu barrio o de Neiva y escribe una propuesta para solucionarlo.",a:"Ejemplo: Problema: hay basura en la orilla del río Las Ceibas. Propuesta: organizar jornadas de limpieza cada mes con la junta de acción comunal y poner avisos de prohibido botar basura."},
{q:"Escribe dos argumentos que apoyen tu propuesta anterior.",a:"Ejemplo: 1) Porque un río limpio evita malos olores y enfermedades. 2) Ya que cuando la comunidad participa, aprende a cuidar lo que limpió."},
{q:"¿Por qué una propuesta sin argumentos no convence?",a:"Porque el lector no sabe por qué la solución funcionaría; sin razones, es solo una opinión."}]},
{id:"niveles",ref:`<div class="story"><b>La figura perdida</b><br>Esa noche en San Agustín llovía sin parar. Don Aurelio, el celador del museo, cerró la reja a las nueve, como siempre. A las once escuchó pasos en la sala de las estatuas. Tomó la linterna y bajó despacio, con el corazón golpeándole el pecho. En el piso encontró huellas de barro que iban hacia la ventana rota. Faltaba una pequeña figura de piedra.<br>Al día siguiente, la inspectora Rocío revisó las huellas: eran de botas de caucho, talla 38, con restos de pasto recién cortado.<br>—El ladrón no vino de lejos —dijo, mirando al jardinero, que esa mañana había llegado en zapatos y no en sus botas de siempre.</div>`,name:"Niveles de lectura",desc:"Literal, inferencial y crítico, aplicados a un cuento policíaco corto.",
exp:`<h3>Los tres niveles</h3>
<div class="xcards">
<div class="xc"><b>Literal</b><span>Lo que el texto <u>dice directamente</u>: personajes, lugares, hechos, fechas.</span><i>Pregunta típica: ¿Quién…? ¿Dónde…? ¿A qué hora…?</i></div>
<div class="xc"><b>Inferencial</b><span>Lo que <u>no se dice</u> pero se puede deducir con pistas del texto.</span><i>¿Por qué crees que…? ¿Qué se puede concluir…?</i></div>
<div class="xc"><b>Crítico</b><span>Tu <u>opinión o juicio</u> sobre el texto, con argumentos.</span><i>¿Estás de acuerdo…? ¿Qué opinas de…?</i></div></div>
<h3>Lee este cuento (lo usarás en el cuestionario)</h3>
<div class="story"><b>La figura perdida</b><br>Esa noche en San Agustín llovía sin parar. Don Aurelio, el celador del museo, cerró la reja a las nueve, como siempre. A las once escuchó pasos en la sala de las estatuas. Tomó la linterna y bajó despacio, con el corazón golpeándole el pecho. En el piso encontró huellas de barro que iban hacia la ventana rota. Faltaba una pequeña figura de piedra.<br>Al día siguiente, la inspectora Rocío revisó las huellas: eran de botas de caucho, talla 38, con restos de pasto recién cortado.<br>—El ladrón no vino de lejos —dijo, mirando al jardinero, que esa mañana había llegado en zapatos y no en sus botas de siempre.</div>
<p class="small">Cuento escrito para este repaso. Es del género policíaco: hay un misterio, pistas y alguien que investiga.</p>
<div class="tip"><b>En las pruebas tipo Saber:</b> vuelve al texto para buscar la pista que justifica tu respuesta. La profe pide <b>justificar</b>.</div>`,
qs:[
{q:"(Literal) ¿A qué hora cerró la reja don Aurelio?",o:["A las nueve","A las once","A medianoche","En la mañana"],h:"Búscalo en la segunda oración del cuento.",e:"El texto dice: «cerró la reja a las nueve, como siempre»."},
{q:"(Literal) ¿Qué objeto desapareció del museo?",o:["Una pequeña figura de piedra","Una linterna","Unas botas de caucho","La reja"],h:"Lee el final del primer párrafo.",e:"«Faltaba una pequeña figura de piedra»."},
{q:"(Inferencial) ¿Cómo se sentía don Aurelio al bajar a la sala?",o:["Asustado","Feliz","Aburrido","Enojado"],h:"«Con el corazón golpeándole el pecho».",e:"El texto no dice «asustado», pero se deduce por la descripción de su corazón."},
{q:"(Inferencial) ¿De quién sospecha la inspectora Rocío?",o:["Del jardinero","De don Aurelio","De un turista","De nadie"],h:"¿A quién mira cuando habla?",e:"Mira al jardinero al decir que el ladrón no vino de lejos."},
{q:"(Inferencial) ¿Por qué es sospechoso que el jardinero llegara en zapatos?",o:["Porque pudo esconder las botas que dejaron las huellas","Porque los zapatos estaban sucios","Porque llegó tarde","Porque no le gusta el pasto"],h:"Relaciona las huellas con las botas.",e:"Las huellas eran de botas con pasto cortado; si no trajo sus botas, quizá las escondió."},
{q:"(Inferencial) El cuento pertenece al género policíaco porque:",o:["Hay un misterio, pistas y alguien que investiga","Tiene un final feliz con humor","Cuenta la vida de un personaje real","Busca vender un producto"],h:"¿Qué hace la inspectora?",e:"El policíaco gira alrededor de un crimen o misterio que se investiga con pistas."},
{q:"(Crítico) ¿Cuál opinión está mejor argumentada?",o:["Las pistas apuntan al jardinero, pero no bastan para acusarlo: falta encontrar las botas o la figura","El jardinero es culpable porque me cae mal","La inspectora se equivocó porque sí","Don Aurelio es el ladrón porque es el celador"],h:"Una buena opinión se apoya en el texto.",e:"Es la única que usa información del texto y razona sobre ella."}],
open:[
{q:"(Literal) ¿Cómo eran las huellas que encontró la inspectora? Escribe los tres detalles.",a:"Eran de botas de caucho, talla 38, y tenían restos de pasto recién cortado."},
{q:"(Inferencial) ¿Qué quiso decir la inspectora con «El ladrón no vino de lejos»?",a:"Que el ladrón era alguien que trabajaba o estaba cerca del museo, porque el pasto recién cortado indica el jardín del propio museo."},
{q:"(Crítico) ¿Estás de acuerdo con que la inspectora sospeche del jardinero? Justifica tu respuesta con pistas del texto.",a:"Respuesta personal argumentada. Ejemplo: Sí, porque las huellas tenían pasto cortado y él no llevó sus botas; pero antes de acusarlo hay que buscar más pruebas."}]}
]},

const EXTRA={
intra:{drop:[6,7,11,13],
exp:`<h3>¿Qué es?</h3><p><b>Intra = dentro.</b> Son las relaciones entre individuos de la <b>misma especie</b>: chigüiro con chigüiro, garza con garza. A veces se ayudan y a veces compiten.</p>
<h3>Los 4 tipos que vimos</h3><div class="xcards">
<div class="xc"><b>Familiar</b><span>Se agrupan para <u>reproducirse y cuidar a sus crías</u>.</span><i>Ej.: una pareja de guacamayas con sus polluelos en el nido.</i></div>
<div class="xc"><b>Gregaria</b><span>Se reúnen <u>temporalmente</u> para desplazarse, alimentarse o protegerse, y luego se separan.</span><i>Ej.: los bocachicos en la subienda del río Magdalena, una bandada de garzas, una manada de chigüiros.</i></div>
<div class="xc"><b>Colonial</b><span>Permanecen <u>unidos físicamente</u> y forman una estructura organizada.</span><i>Ej.: los corales.</i></div>
<div class="xc"><b>Competencia</b><span>Individuos de la misma especie se disputan un <u>recurso limitado</u>: alimento, territorio o pareja.</span><i>Ej.: dos gallos de una finca peleando por el territorio.</i></div></div>
<div class="tip"><b>Truco para no confundirte:</b> gregaria = se juntan <u>un rato</u>; colonial = quedan <u>pegados</u>.</div>`,
open:[
{q:"Explica con tus palabras la diferencia entre una agrupación gregaria y una colonial. Da un ejemplo de cada una.",a:"En la gregaria los individuos se reúnen solo por un tiempo para desplazarse, alimentarse o protegerse, y luego se separan (ej.: garzas, bocachicos en la subienda). En la colonial permanecen unidos físicamente formando una estructura organizada (ej.: corales)."},
{q:"¿Qué es la competencia intraespecífica? Nombra los tres recursos por los que compiten.",a:"Es cuando individuos de la misma especie se disputan un recurso limitado. Compiten por alimento, territorio y pareja."},
{q:"Escribe un ejemplo de relación familiar (de tu casa, una finca o un documental) y explica por qué es familiar.",a:"Respuesta modelo: una gallina con sus pollitos en la finca. Es familiar porque se agrupan para reproducirse y cuidar de las crías. Cualquier ejemplo vale si muestra padres cuidando crías de su misma especie."},
{q:"¿Por qué los bocachicos viajan en grandes grupos durante la subienda? ¿Qué tipo de agrupación es?",a:"Porque en grupo se protegen mejor de los depredadores y se desplazan juntos río arriba para reproducirse. Es una agrupación gregaria porque la unión es temporal."}]},
inter:{drop:[7,8,9,13],
exp:`<h3>¿Qué es?</h3><p><b>Inter = entre.</b> Son las relaciones entre organismos de <b>especies diferentes</b>: la vaca y la garrapata, la abeja y la flor del café.</p>
<h3>Tabla para memorizar</h3><p class="small">(+) gana · (–) pierde · (0) no le pasa nada</p>
<div class="xt"><table><thead><tr><th>Relación</th><th>Signos</th><th>Qué pasa</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Mutualismo</b></td><td>+ / +</td><td>Las dos especies ganan.</td><td>Abeja y flor del cafeto</td></tr>
<tr><td><b>Comensalismo</b></td><td>+ / 0</td><td>Una gana y a la otra no la afecta.</td><td>Garcita bueyera y vaca</td></tr>
<tr><td><b>Parasitismo</b></td><td>+ / –</td><td>El parásito vive a costa del <u>hospedero</u> y lo perjudica, sin matarlo de inmediato.</td><td>Garrapata en la vaca</td></tr>
<tr><td><b>Depredación</b></td><td>+ / –</td><td>El depredador captura y se come a la <u>presa</u>.</td><td>Jaguar y chigüiro</td></tr>
<tr><td><b>Competencia</b></td><td>– / –</td><td>Especies distintas se disputan el mismo recurso.</td><td>Gavilán y lechuza por los ratones</td></tr>
</tbody></table></div>
<h3>Simbiosis</h3><p>Es una asociación <b>estrecha y permanente</b> entre organismos de diferente especie en la que existe <b>dependencia</b>. Ej.: los líquenes que se ven en los troncos y piedras son un hongo y un alga viviendo juntos.</p>
<div class="tip"><b>Ojo con el examen:</b> parásito y depredador los dos ganan a costa del otro, pero el depredador <u>se come</u> a la presa y el parásito <u>vive</u> de su hospedero.</div>`,
open:[
{q:"Explica la diferencia entre mutualismo y comensalismo con un ejemplo de cada uno.",a:"En el mutualismo las dos especies se benefician (abeja y flor: néctar y polinización). En el comensalismo una se beneficia y la otra no se afecta (garcita bueyera y vaca)."},
{q:"¿Por qué la relación entre la garrapata y la vaca es parasitismo y no depredación?",a:"Porque la garrapata vive sobre la vaca y se alimenta de su sangre perjudicándola, pero no la caza ni se la come. En la depredación el depredador captura y consume a la presa."},
{q:"¿Qué es la simbiosis? Da un ejemplo.",a:"Es una asociación estrecha y permanente entre organismos de diferente especie en la que existe dependencia. Ejemplo: los líquenes (un hongo y un alga)."},
{q:"Escribe la diferencia entre relación intraespecífica e interespecífica.",a:"La intraespecífica ocurre entre individuos de la misma especie (intra = dentro). La interespecífica ocurre entre organismos de especies diferentes (inter = entre)."}]},
trofica:{drop:[6,9,10,14],
exp:`<h3>Cadena alimenticia</h3><p>Muestra <b>quién se come a quién</b> y cómo pasa la energía. Las flechas van del que es comido hacia el que come.</p>
<div class="chain"><span class="ln sun">Sol</span><span class="ar">→</span><span class="ln">Pasto<small>Productor</small></span><span class="ar">→</span><span class="ln">Saltamontes<small>Consumidor 1.°</small></span><span class="ar">→</span><span class="ln">Rana<small>Consumidor 2.°</small></span><span class="ar">→</span><span class="ln">Serpiente<small>Consumidor 3.°</small></span><span class="ar">→</span><span class="ln">Águila<small>Consumidor 4.°</small></span></div>
<div class="xcards">
<div class="xc"><b>Productores</b><span>Fabrican su alimento con la luz del sol (fotosíntesis).</span><i>Plantas, pasto, maíz, algas.</i></div>
<div class="xc"><b>Consumidores</b><span>Se alimentan de otros. Primarios = herbívoros; secundarios y terciarios = carnívoros.</span><i>Vaca, rana, serpiente, jaguar.</i></div>
<div class="xc"><b>Descomponedores</b><span>Bacterias y hongos que transforman los restos en materia que luego usan los productores.</span><i>El hongo que pudre una fruta caída.</i></div></div>
<h3>Pirámide trófica</h3><p>Son los mismos niveles, pero en forma de pirámide. Abajo van los productores. <b>Al subir, la energía disminuye</b>: solo pasa cerca del 10 % al siguiente nivel. Por eso hay muchos chigüiros y pocos jaguares.</p>
<div class="pyr"><div style="width:34%">Consumidor 3.° · 10 kcal</div><div style="width:54%">Consumidor 2.° · 100 kcal</div><div style="width:76%">Consumidor 1.° · 1.000 kcal</div><div style="width:100%">Productores · 10.000 kcal</div></div><p class="small">Ejemplo de cómo baja la energía: de cada 10.000 kcal que tienen las plantas, solo unas 1.000 llegan a los herbívoros.</p>
<div class="tip"><b>Para el examen:</b> si quitas un eslabón, toda la cadena cambia. Sin ranas, aumentan los saltamontes.</div>`,
open:[
{q:"Arma una cadena alimenticia de 4 eslabones con seres vivos del Huila y escribe el nivel de cada uno.",a:"Respuesta modelo: maíz (productor) → ratón (consumidor primario) → serpiente (consumidor secundario) → gavilán (consumidor terciario). Vale cualquier cadena que empiece por un productor y donde cada uno se coma al anterior."},
{q:"¿Qué pasaría en un ecosistema si desaparecieran los descomponedores?",a:"Se acumularían los restos de plantas y animales muertos, y el suelo no recuperaría los nutrientes. Las plantas crecerían menos y toda la cadena se afectaría."},
{q:"¿Por qué la energía disminuye al subir en la pirámide trófica?",a:"Porque cada ser vivo gasta gran parte de la energía en vivir (moverse, respirar, crecer) y solo una pequeña parte (cerca del 10 %) pasa al siguiente nivel."},
{q:"¿Por qué las plantas están en la base de la pirámide trófica?",a:"Porque son productoras: fabrican su alimento con la energía del sol y de ellas depende la energía de todos los demás niveles. Son las que tienen más energía."}]}
};

{p:"Los peces payaso viven entre los tentáculos de la anémona: ella los protege y ellos la limpian y le espantan enemigos.",r:"1) Especies distintas. 2) Pez gana (+) y anémona gana (+). 3) (+, +) = mutualismo."},
{p:"Un zancudo pica a una persona para alimentarse de su sangre.",r:"1) Especies distintas. 2) Zancudo gana (+), persona pierde (–) y no muere. 3) Vive a costa de ella: parasitismo (la persona es el hospedero)."}],
err:["Decir que la garcita bueyera y la vaca son mutualismo. La vaca no gana nada: es comensalismo (+, 0).","Llamar «presa» al animal que tiene parásitos. El que tiene parásitos es el «hospedero»; la presa es la que se come el depredador.","Olvidar que la competencia también puede ser interespecífica, como el gavilán y la lechuza que cazan los mismos ratones."],
retos:[{q:"¿Qué signos tiene el mutualismo?",a:"(+, +): las dos especies ganan."},{q:"Un tigrillo caza una ardilla. ¿Qué relación es?",a:"Depredación: el tigrillo es el depredador y la ardilla la presa."},{q:"¿Qué es la simbiosis?",a:"Una asociación estrecha y permanente entre especies diferentes con dependencia, como los líquenes (hongo + alga)."}],
dato:"Los líquenes que ves en troncos y piedras son muy sensibles a la contaminación. Si hay muchos líquenes en un lugar, es señal de que el aire es limpio."},
trofica:{ideas:["Toda la energía empieza en el sol y entra a la cadena por los productores (las plantas).","Cada ser vivo pasa al siguiente solo una pequeña parte de su energía (cerca del 10 %).","Por eso la pirámide es ancha abajo y angosta arriba: hay muchas plantas, menos herbívoros y pocos carnívoros."],
ej:[{p:"Ordena y clasifica: serpiente, maíz, gavilán, ratón.",r:"1) Busca el productor: el maíz. 2) ¿Quién come maíz? El ratón (consumidor primario). 3) ¿Quién come ratones? La serpiente (consumidor secundario). 4) ¿Quién come serpientes? El gavilán (consumidor terciario). Cadena: maíz → ratón → serpiente → gavilán."},
{p:"Si las plantas de un potrero tienen 10.000 unidades de energía, ¿cuánta le llega más o menos a la vaca que se las come?",r:"Solo pasa cerca del 10 %. 10 % de 10.000 = 1.000 unidades. El resto la planta lo usó para vivir."},
{p:"En un río se pescan casi todas las garzas. ¿Qué pasa con los peces pequeños que ellas comían?",r:"Al faltar su depredador, los peces pequeños aumentan. Luego podrían acabarse las algas que ellos comen. Un cambio afecta a toda la cadena."}],
err:["Poner las flechas al revés. La flecha va del que es comido al que come: pasto → vaca (la energía va hacia la vaca).","Olvidar a los descomponedores. Aunque no siempre se dibujan, reciclan los restos de todos los niveles.","Creer que la energía aumenta al subir. Es al contrario: disminuye en cada nivel."],
retos:[{q:"¿En qué nivel de la pirámide va la vaca?",a:"Consumidor primario (herbívoro), justo encima de los productores."},{q:"¿Por qué hay pocos jaguares y muchos chigüiros?",a:"Porque la energía disminuye al subir de nivel y no alcanza para muchos depredadores grandes."},{q:"¿Qué hacen los hongos que pudren una fruta caída?",a:"Son descomponedores: transforman los restos en nutrientes para el suelo."}],
dato:"Un jaguar necesita un territorio muy grande, de decenas de kilómetros cuadrados, para encontrar suficientes presas. Es la pirámide trófica en acción."},
lenguaje:{ideas:["En álgebra una letra (x, a, n) representa un número que no conocemos.","Cada palabra tiene su traducción: doble = 2x, mitad = x/2, aumentado = +, disminuido = −.","Se lee en orden: primero lo que le pasa al número y luego lo que se suma o se resta."],
ej:[{p:"Traduce: «el doble de un número aumentado en 3».",r:"1) Un número = x. 2) El doble = 2x. 3) Aumentado en 3 = + 3. Respuesta: 2x + 3."},
{p:"Traduce: «la mitad de un número disminuida en 1».",r:"1) Un número = x. 2) La mitad = x/2. 3) Disminuida en 1 = − 1. Respuesta: x/2 − 1."},
{p:"Juan tiene x mil pesos. Compra una empanada de 2 mil y recibe 5 mil de su abuela. ¿Cuánto tiene?",r:"1) Empieza con x. 2) Gasta 2 → x − 2. 3) Recibe 5 → x − 2 + 5. Respuesta: x + 3 (mil pesos)."}],
err:["Escribir x² cuando dice «el doble». El doble es 2x; el cuadrado es x².","Escribir 4 − x cuando dice «un número disminuido en 4». Lo correcto es x − 4: al número le quitas 4.","Usar la misma letra para dos números distintos. «La suma de dos números» es a + b, no x + x."],
retos:[{q:"Traduce: «el triple de un número».",a:"3x"},{q:"Traduce: «un número aumentado en 10».",a:"x + 10"},{q:"¿Qué dice x² + 1 en palabras?",a:"El cuadrado de un número aumentado en uno."}],
dato:"La palabra «álgebra» viene del árabe «al-jabr», del título de un libro escrito hace más de 1.000 años por el matemático Al-Juarismi."},
termino:{ideas:["Un término es una sola pieza: números y letras multiplicándose, sin + ni − en medio.","Tiene cuatro partes: signo, coeficiente, parte literal y exponente.","El grado se saca sumando los exponentes de las letras (¡no el coeficiente!)."],
ej:[{p:"Analiza el término −4x²y.",r:"Signo: negativo. Coeficiente: 4. Parte literal: x²y. Exponentes: x tiene 2, y tiene 1. Grado: 2 + 1 = 3."},
{p:"Analiza el término m.",r:"Signo: positivo (no se ve, pero es +). Coeficiente: 1 (m = 1m). Parte literal: m. Exponente: 1. Grado: 1."},
{p:"¿Cuál tiene mayor grado: 9a² o 2a²b²?",r:"9a²: grado 2. 2a²b²: 2 + 2 = 4. Tiene mayor grado 2a²b², aunque su coeficiente sea más pequeño."}],
err:["Sumar el coeficiente al calcular el grado. En 5x³ el grado es 3, no 8.","Decir que x no tiene coeficiente. Sí tiene: es 1.","Olvidar el exponente 1 de las letras que no muestran número: en 3ab el grado es 1 + 1 = 2."],
retos:[{q:"¿Cuál es el coeficiente de −8y³?",a:"8 (y el signo es negativo)."},{q:"¿Cuál es el grado de 7abc?",a:"3, porque cada letra tiene exponente 1: 1 + 1 + 1."},{q:"¿Cuál es la parte literal de 6m²n?",a:"m²n"}],
dato:"El matemático francés René Descartes popularizó usar las últimas letras del abecedario (x, y, z) para los valores desconocidos. Por eso hoy casi siempre usamos x."},
expresiones:{ideas:["Una expresión algebraica junta términos con signos + y −.","Se clasifica contando términos: 1 monomio, 2 binomio, 3 trinomio, 4 o más polinomio.","El grado de la expresión es el grado más alto de sus términos."],
ej:[{p:"Clasifica 5x² − 3x.",r:"1) Separa por + y −: 5x² | −3x. 2) Son 2 términos → binomio. 3) Grados: 2 y 1 → grado de la expresión: 2."},
{p:"Clasifica 4abc.",r:"No hay + ni −: es un solo término → monomio. Grado: 1 + 1 + 1 = 3."},
{p:"Clasifica a³ + 2a² − a + 7.",r:"Términos: a³ | 2a² | −a | 7 → 4 términos → polinomio. Grados: 3, 2, 1, 0 → grado 3."}],
err:["Contar las letras en vez de los términos. 2ab tiene dos letras, pero es un solo término (monomio).","Olvidar el número suelto. En x² + x + 5, el 5 también es un término: es trinomio.","Creer que el grado de la expresión es la suma de todos los grados. Es solo el mayor."],
retos:[{q:"¿Qué es 3m − 2?",a:"Un binomio (2 términos)."},{q:"¿Cuántos términos tiene x²y − xy + y − 1?",a:"4: es un polinomio."},{q:"¿Cuál es el grado de 2x + x⁴?",a:"4, el mayor de sus términos."}],
dato:"«Mono», «bi», «tri» y «poli» vienen del griego y significan uno, dos, tres y muchos. Los mismos prefijos están en monociclo, bicicleta, triciclo y polideportivo."},
valor:{ideas:["Valor numérico = cambiar cada letra por su número y resolver.","Pon el número entre paréntesis al reemplazar, sobre todo si es negativo.","Respeta el orden: primero potencias, luego multiplicaciones y divisiones, al final sumas y restas."],
ej:[{p:"Halla el valor de 5x − 2 si x = 3.",r:"1) Reemplazo: 5(3) − 2. 2) Multiplico: 15 − 2. 3) Resto: 13."},
{p:"Halla el valor de x² + 3x si x = 2.",r:"1) Reemplazo: (2)² + 3(2). 2) Potencia: 4 + 3(2). 3) Multiplico: 4 + 6. 4) Sumo: 10."},
{p:"Halla el valor de 2a + b si a = −1 y b = 5.",r:"1) Reemplazo: 2(−1) + 5. 2) Multiplico: −2 + 5. 3) Sumo: 3."}],
err:["Escribir 3x con x = 4 como «34». 3x significa 3 por x: 3 × 4 = 12.","Multiplicar antes de la potencia: en 2x² con x = 3 no es (2·3)² = 36, sino 2·9 = 18.","Perder el signo negativo. Si x = −2, entonces x² = (−2)² = 4 (positivo)."],
retos:[{q:"Valor de 4y si y = 5.",a:"20"},{q:"Valor de a² − 1 si a = 3.",a:"9 − 1 = 8"},{q:"Valor de x + y si x = 6 y y = −4.",a:"6 + (−4) = 2"}],
dato:"Cada vez que usas una fórmula, como el área de un cuadrado A = L², estás calculando un valor numérico."},
experimentos:{ideas:["Determinista: sabes el resultado antes de hacerlo.","Aleatorio: conoces lo que puede salir, pero no sabes qué va a salir.","Pregunta clave: «¿Puedo estar segura del resultado?» Sí → determinista. No → aleatorio."],
ej:[{p:"¿Echar sal en el agua del sancocho la vuelve salada?",r:"Siempre pasa lo mismo y lo sabemos antes → determinista."},
{p:"¿Sacar una ficha de parqués de una bolsa sin mirar?",r:"Sabemos qué colores hay, pero no cuál saldrá → aleatorio."},
{p:"¿Que el profe escoja al azar quién pasa al tablero?",r:"Puede salir cualquier estudiante y no se sabe quién → aleatorio."}],
err:["Pensar que algo es determinista porque conocemos los posibles resultados. Saber que el dado da de 1 a 6 no dice cuál número saldrá: es aleatorio.","Confundir «aleatorio» con «imposible». Aleatorio significa que depende del azar.","Creer que si algo es muy probable, es determinista. Que hoy llueva puede ser muy probable, pero no es seguro."],
retos:[{q:"¿Lanzar un dado de parqués es aleatorio o determinista?",a:"Aleatorio."},{q:"¿Encender un bombillo bueno al subir el interruptor?",a:"Determinista: siempre se prende."},{q:"¿Qué tienen todos los experimentos aleatorios?",a:"Se conocen los resultados posibles, pero no se puede predecir cuál saldrá."}],
dato:"La probabilidad nació en el siglo XVII con juegos de dados: los matemáticos Pascal y Fermat se escribían cartas para resolver problemas de apuestas."},
espacio:{ideas:["El espacio muestral es la lista de TODO lo que puede salir.","Se escribe con S y entre llaves: S = {…}.","Cuando hay dos o más pasos, el orden importa: CS y SC son resultados diferentes."],
ej:[{p:"Escribe el espacio muestral de girar una ruleta con 3 colores: rojo, azul y amarillo.",r:"S = {rojo, azul, amarillo}. Tiene 3 elementos."},
{p:"Escribe el espacio muestral de lanzar dos monedas.",r:"Primera moneda C o S, segunda C o S: S = {CC, CS, SC, SS}. Son 4."},
{p:"En un sorteo del curso hay 3 nombres: Ana, Beto y Caro. ¿Cuál es el espacio muestral al sacar uno?",r:"S = {Ana, Beto, Caro}. 3 elementos."}],
err:["Olvidar resultados, por ejemplo escribir {CC, CS, SS} y dejar por fuera SC.","Escribir el espacio muestral sin llaves o con paréntesis.","Incluir resultados imposibles, como el 7 en un dado normal."],
retos:[{q:"¿Cuál es el espacio muestral de lanzar una moneda?",a:"S = {cara, sello}"},{q:"¿Cuántos elementos tiene el espacio muestral de lanzar un dado?",a:"6"},{q:"Al lanzar dos monedas, ¿CS y SC son lo mismo?",a:"No: en CS la primera sale cara; en SC la primera sale sello."}],
dato:"Una baraja de póker tiene 52 cartas, así que el espacio muestral de sacar una carta tiene 52 elementos."},
arbol:{ideas:["El diagrama de árbol dibuja cada elección como un nivel de ramas.","Cada camino completo, de inicio a fin, es un resultado posible.","Para saber cuántos resultados hay, cuenta los finales de las ramas."],
ej:[{p:"Para el desayuno hay arepa o pan, y chocolate o café. ¿Cuántos desayunos hay?",r:"arepa → chocolate / café; pan → chocolate / café. Caminos: arepa-chocolate, arepa-café, pan-chocolate, pan-café. Son 4."},
{p:"Lanzas una moneda dos veces.",r:"C → C / S; S → C / S. Caminos: CC, CS, SC, SS. Son 4."},
{p:"Escoges un deporte (fútbol, voleibol) y un horario (mañana, tarde, noche).",r:"De cada deporte salen 3 ramas: 2 × 3 = 6 caminos. Ej.: fútbol-mañana, fútbol-tarde, fútbol-noche, voleibol-mañana, voleibol-tarde, voleibol-noche."}],
err:["Contar las ramas del primer nivel en vez de los finales.","No repetir las opciones en cada rama: de cada camiseta deben salir TODOS los pantalones.","Mezclar los niveles: primero va una elección completa y después la otra."],
retos:[{q:"Hay 3 sabores de jugo y 2 tamaños. ¿Cuántos caminos tiene el árbol?",a:"6"},{q:"¿Qué representa cada camino del árbol?",a:"Un resultado posible."},{q:"Si lanzas una moneda tres veces, ¿cuántos finales tiene el árbol?",a:"8"}],
dato:"El árbol genealógico de tu familia usa la misma idea: cada rama muestra un camino desde los abuelos hasta los nietos."},
multiplicacion:{ideas:["Si una elección tiene m opciones y otra tiene n, juntas tienen m × n.","Funciona con tres o más elecciones: se multiplican todas.","Es la forma rápida de contar sin dibujar el árbol."],
ej:[{p:"Para la fiesta hay 4 vestidos y 3 pares de zapatos.",r:"Elección 1: 4. Elección 2: 3. Total: 4 × 3 = 12 formas."},
{p:"Un almuerzo en Neiva: 3 sopas, 2 platos fuertes y 4 jugos.",r:"3 × 2 × 4 = 24 almuerzos diferentes."},
{p:"Una clave de 2 dígitos (0 a 9).",r:"Primer dígito: 10. Segundo: 10. Total: 10 × 10 = 100 claves (de 00 a 99)."}],
err:["Sumar en lugar de multiplicar: 4 vestidos y 3 zapatos no dan 7, dan 12.","Olvidar una de las elecciones al multiplicar.","Olvidar que el 0 también es un dígito: del 0 al 9 hay 10 opciones, no 9."],
retos:[{q:"2 gorras y 5 camisetas: ¿cuántas combinaciones?",a:"10"},{q:"Lanzar un dado y una moneda: ¿cuántos resultados?",a:"12"},{q:"¿Cuántas claves de 3 dígitos hay?",a:"1.000"}],
dato:"Si las placas tuvieran 3 letras (de 26) y 3 números, habría 26 × 26 × 26 × 10 × 10 × 10 = 17.576.000 placas posibles."},
dramatico:{ideas:["Las obras dramáticas se escriben para ser actuadas, no solo leídas.","No hay narrador: la historia avanza con el diálogo y las acotaciones.","Hay tres subgéneros principales: tragedia, comedia y drama."],
ej:[{p:"Identifica las partes: «CARLOS: (Gritando desde la puerta.) ¡Ya llegó el bus!»",r:"CARLOS = personaje que habla. (Gritando desde la puerta.) = acotación. ¡Ya llegó el bus! = diálogo o parlamento."},
{p:"Una obra donde un joven intenta impresionar a su vecina y todo le sale mal de forma chistosa, pero al final ella acepta salir con él.",r:"Humor + final feliz = comedia."},
{p:"Un rey que por orgullo pierde su reino y a su familia.",r:"Conflicto grave + final triste = tragedia."}],
err:["Leer las acotaciones en voz alta como si fueran diálogo. Son instrucciones para actuar.","Confundir acto con escena. El acto es una parte grande; la escena cambia cuando entra o sale un personaje.","Pensar que en el teatro hay narrador como en un cuento."],
retos:[{q:"¿Dónde van normalmente las acotaciones?",a:"Entre paréntesis."},{q:"¿Qué subgénero tiene humor y final feliz?",a:"La comedia."},{q:"¿Cómo avanza la historia en el teatro?",a:"Con el diálogo y las acciones de los personajes."}],
dato:"El teatro nació en la antigua Grecia hace unos 2.500 años. Las dos máscaras del teatro, una feliz y una triste, representan la comedia y la tragedia."},
variantes:{ideas:["Todos hablamos español, pero lo usamos distinto según dónde, quién, en qué situación y cuándo.","Por eso hay cuatro variantes: geográfica, social, situacional e histórica.","Ninguna forma de hablar es mejor que otra; lo importante es adaptarse a la situación."],
ej:[{p:"En una región dicen «guineo» y en otra «banano».",r:"Cambia según el lugar → variante geográfica (diatópica)."},
{p:"Un médico dice «cefalea» y un niño dice «me duele la cabeza».",r:"Cambia según la profesión o el grupo → variante social (diastrática)."},
{p:"En un discurso dices «Respetados profesores» y en el descanso «¡Ey, qué más!».",r:"Cambia según la situación → variante situacional (diafásica)."}],
err:["Confundir la variante social con la situacional. Social depende de QUIÉN eres; situacional depende de DÓNDE o CON QUIÉN estás hablando en ese momento.","Pensar que hablar con acento es hablar mal.","Creer que el idioma no cambia con el tiempo. Cambia: eso es la variante histórica."],
retos:[{q:"Las palabras de los jóvenes son variante…",a:"Social."},{q:"Hablar formal en una entrevista es variante…",a:"Situacional."},{q:"Las palabras que usaban los abuelos y ya no se usan muestran la variante…",a:"Histórica."}],
dato:"En Colombia, además del español, se hablan más de 60 lenguas indígenas y también lenguas criollas como la de San Basilio de Palenque."},
conectores:{ideas:["Los conectores son el pegante de las ideas.","Cada tipo dice algo: sumar (y, además), oponer (pero, sin embargo), causa (porque), consecuencia (por eso), orden (primero, luego) y cierre (en conclusión).","Si cambias el conector, cambia el sentido de la oración."],
ej:[{p:"Une: «Tenía hambre» + «no había comida».",r:"Las ideas se oponen → contraste: Tenía hambre, pero no había comida."},
{p:"Une: «Practiqué mucho» + «gané el campeonato».",r:"Lo segundo es resultado de lo primero → consecuencia: Practiqué mucho; por eso gané el campeonato."},
{p:"Une: «Me puse la chaqueta» + «hacía frío».",r:"Lo segundo explica el porqué → causa: Me puse la chaqueta porque hacía frío."}],
err:["Usar «porque» cuando va «por eso». «Porque» da la causa; «por eso» da la consecuencia.","Repetir siempre «y» o «entonces». Varía los conectores para que el texto suene mejor.","Usar «sin embargo» para sumar ideas. «Sin embargo» opone, igual que «pero»."],
retos:[{q:"¿«Además» es de adición o de contraste?",a:"De adición."},{q:"¿Qué tipo de conector es «ya que»?",a:"De causa."},{q:"Completa: «Llovió mucho; ___ el río creció.»",a:"Por eso / por lo tanto (consecuencia)."}],
dato:"Un texto sin conectores parece una lista de frases sueltas. Los buenos escritores los usan para que el lector no se pierda."},
puntuacion:{ideas:["Los signos de puntuación son las señales de tránsito del texto: dicen dónde parar, pausar o preguntar.","La coma separa listas y el nombre de a quién le hablas; los dos puntos anuncian algo.","La tilde diacrítica distingue palabras iguales: tú/tu, él/el, sí/si, mí/mi, más/mas, té/te."],
ej:[{p:"Corrige: «juan trajo pan queso y jugo»",r:"Mayúscula en el nombre y comas en la lista: Juan trajo pan, queso y jugo."},
{p:"Corrige: «tu sabes donde esta mi cuaderno»",r:"Es pregunta y «tú» es persona: ¿Tú sabes dónde está mi cuaderno?"},
{p:"¿«Si» o «sí»? «___ estudias, ___ vas a ganar.»",r:"Primero condición (si); después afirmación (sí): Si estudias, sí vas a ganar."}],
err:["Olvidar el signo de apertura ¿ o ¡. En español se abren y se cierran.","Poner coma entre el sujeto y el verbo: «Mi hermano, juega fútbol» es incorrecto.","Tildar «mi» cuando es de quién es algo: «mí casa» es incorrecto; va «mi casa»."],
retos:[{q:"¿Qué signo va antes de una lista que se anuncia?",a:"Dos puntos (:)."},{q:"¿«Él» o «el»? «___ perro de mi tía.»",a:"El (artículo, sin tilde)."},{q:"¿Para qué sirve el punto aparte?",a:"Para terminar un párrafo y empezar otro."}],
dato:"El español es casi el único idioma que abre las preguntas y las exclamaciones con ¿ y ¡. Así sabes desde el inicio cómo leer la frase."},
biografia:{ideas:["Biografía = otro cuenta tu vida (él, ella). Autobiografía = tú cuentas tu vida (yo).","Se cuenta en orden de tiempo: nacimiento, infancia, estudios, logros y presente o legado.","Debe tener datos reales y verificables."],
ej:[{p:"¿Biografía o autobiografía? «Ella nació en Neiva y desde niña quiso ser veterinaria.»",r:"Usa tercera persona (ella) → biografía."},
{p:"¿Biografía o autobiografía? «Mi primer recuerdo es la finca de mi abuelo en Rivera.»",r:"Usa primera persona (mi) → autobiografía."},
{p:"Ordena: «publicó La vorágine» – «nació en 1888» – «estudió derecho» – «murió en 1928».",r:"Orden cronológico: nació en 1888 → estudió derecho → publicó La vorágine → murió en 1928."}],
err:["Mezclar «yo» y «él» en el mismo texto.","Contar los hechos desordenados.","Inventar datos para que suene más bonito. La biografía debe ser verdadera."],
retos:[{q:"¿En qué persona se escribe la biografía?",a:"En tercera persona (él, ella)."},{q:"¿Qué significa «auto» en autobiografía?",a:"Uno mismo."},{q:"¿Qué orden siguen los hechos?",a:"Cronológico: del más antiguo al más reciente."}],
dato:"El municipio de Rivera, en el Huila, se llama así en honor a José Eustasio Rivera, el autor de La vorágine."},
publicidad:{ideas:["Publicidad = quiere venderte algo. Propaganda = quiere convencerte de una idea.","Usan eslogan, imagen, logotipo y un público al que le hablan.","Para convencer usan emociones, personajes famosos, humor y promesas."],
ej:[{p:"«¡Refresco Tatacoa: el que refresca a todo el Huila!»",r:"Ofrece un producto para vender → publicidad. El eslogan es «el que refresca a todo el Huila»."},
{p:"«Apaga la luz que no usas. El planeta te lo agradece.»",r:"No vende nada, promueve una idea → propaganda."},
{p:"Un anuncio de cereal muestra niños felices jugando y un futbolista famoso desayunando.",r:"Estrategias: emoción (alegría) y personaje famoso."}],
err:["Pensar que todo anuncio es publicidad. Si no vende nada y promueve una idea, es propaganda.","Confundir el eslogan con el logotipo. El eslogan es la frase; el logotipo es el dibujo o símbolo.","Creer todo lo que dice un anuncio. Hay que leerlo con mirada crítica."],
retos:[{q:"Una campaña para donar sangre es…",a:"Propaganda."},{q:"¿Cómo se llama la frase corta de un anuncio?",a:"Eslogan."},{q:"¿Qué busca la publicidad?",a:"Vender un producto o servicio."}],
dato:"Muchos eslóganes se recuerdan durante años porque son cortos, riman o se repiten muchas veces."},
propositivo:{ideas:["El texto propositivo responde a la pregunta «¿qué podemos hacer?».","Su estructura: problema → propuesta → argumentos → conclusión.","Los argumentos son las razones que demuestran que la propuesta sirve."],
ej:[{p:"Problema: muchos estudiantes llegan tarde porque el bus pasa a la hora justa.",r:"Propuesta: pedir a la empresa que el bus pase 15 minutos antes. Argumento: así los estudiantes llegan a tiempo, ya que tendrán margen para los trancones. Conclusión: con un pequeño cambio de horario mejora la puntualidad de todos."},
{p:"¿Esto es propuesta o argumento? «Porque así los niños tendrán un lugar seguro para jugar.»",r:"Empieza con «porque» y explica la razón → argumento."},
{p:"¿Esto es problema o propuesta? «Sugiero crear un club de lectura en los descansos.»",r:"Dice qué hacer (sugiero) → propuesta."}],
err:["Quedarse solo en la queja (el problema) sin proponer nada.","Proponer sin dar razones. Una propuesta sin argumentos no convence.","Olvidar la conclusión al final."],
retos:[{q:"¿Qué va primero en un texto propositivo?",a:"El problema."},{q:"¿Qué conector sirve para dar un argumento?",a:"Porque, ya que, puesto que."},{q:"¿Para qué sirve la conclusión?",a:"Para cerrar y recordar la propuesta principal."}],
dato:"Los proyectos que se presentan a las alcaldías o a los concejos municipales son textos propositivos: plantean un problema de la ciudad y proponen cómo resolverlo."},
niveles:{ideas:["Literal: está escrito en el texto. Lo encuentras si buscas.","Inferencial: no está escrito, pero lo deduces con pistas.","Crítico: das tu opinión y la defiendes con razones del texto."],
ej:[{p:"Texto: «Camila cerró el paraguas y se quitó las botas mojadas.» Pregunta literal: ¿Qué se quitó Camila?",r:"Las botas mojadas. Está escrito tal cual."},
{p:"Mismo texto. Pregunta inferencial: ¿Cómo estaba el clima?",r:"Estaba lloviendo. No lo dice, pero el paraguas y las botas mojadas son las pistas."},
{p:"Pregunta crítica: ¿Fue buena idea que Camila usara botas?",r:"Sí, porque llovía y las botas protegen los pies del agua. Es una opinión con argumento del texto."}],
err:["Responder una pregunta inferencial copiando una frase literal. Hay que deducir.","Dar una opinión crítica sin razones: «porque sí» no es argumento.","Inventar cosas que el texto no permite deducir. La inferencia siempre se apoya en pistas."],
retos:[{q:"«¿Dónde ocurre la historia?» suele ser una pregunta de nivel…",a:"Literal."},{q:"«¿Por qué crees que el personaje mintió?» es de nivel…",a:"Inferencial."},{q:"«¿Estás de acuerdo con la decisión del personaje?» es de nivel…",a:"Crítico."}],
dato:"El escritor Edgar Allan Poe es considerado el creador del cuento policíaco, con «Los crímenes de la calle Morgue» (1841)."}
};
SUBJECTS.forEach(su=>su.topics&&su.topics.forEach(t=>{t.deep=DEEP[t.id]}));
const app=document.getElementById('app');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={sub:(store.get('rp_sub')||'bio'),view:'home'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const subj=()=>SUBJECTS.find(s=>s.id===state.sub)||SUBJECTS[0];
function colorVars(s){return `--c:var(${s.c});--soft:var(${s.soft||'--bio-soft'})`}

function home(){
  const s=subj();
  const tabs=SUBJECTS.map(x=>`<button class="tab" role="tab" aria-selected="${x.id===s.id}" style="--c:var(${x.c})" data-sub="${x.id}"><span class="dot"></span>${esc(x.name)}</button>`).join('');
  let body;
  if(s.pending){
    body=`<div class="pending"><h3>Temas de ${esc(s.name)} pendientes</h3>Cuando papá envíe los temas vistos antes de vacaciones, aquí aparecerán la explicación y el cuestionario de esta materia.</div>`;
  }else{
    body=`<div class="topics">`+s.topics.map((t,i)=>{
      const best=store.get('rp_best_'+s.id+'_'+t.id),seen=store.get('rp_seen_'+s.id+'_'+t.id);
      return `<div class="topic"><span class="num">${i+1}</span><div class="tb"><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>
      <div class="tmeta">${seen?'<span class="chip ok">Explicación leída</span>':'<span class="chip">Sin estudiar</span>'}${best!=null?`<span class="chip">Mejor puntaje: ${best}/${t.total}</span>`:`<span class="chip">${t.total} preguntas</span>`}</div>
      <div class="tbtns"><button class="btn ghost" data-exp="${t.id}">1 · Explicación</button><button class="btn" data-quiz="${t.id}">2 · Cuestionario</button></div></div></div>`}).join('')+`</div>`;
  }
  app.innerHTML=`<header class="top"><span class="eyebrow">7.° grado · 4.° periodo</span><h1>Repaso para las evaluaciones</h1><p>Primero estudia la explicación del tema y después presenta el cuestionario. Si te equivocas en una de selección múltiple, tienes una pista y un segundo intento.</p></header>
  <nav class="tabs" role="tablist">${tabs}</nav>
  <section style="${colorVars(s)}"><div class="subject-head"><h2>${esc(s.name)}</h2>${s.desc?`<p>${esc(s.desc)}</p>`:''}</div>${body}</section>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.sub=b.dataset.sub;store.set('rp_sub',state.sub);home()});
  app.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>explain(b.dataset.exp));
  app.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>start(b.dataset.quiz));
  scrollTo(0,0);
}
function explain(tid,step){
  const s=subj(),t=s.topics.find(x=>x.id===tid),d=t.deep||{};
  store.set('rp_seen_'+s.id+'_'+t.id,1);
  const steps=[];
  if(d.ideas)steps.push({k:'En 3 ideas',h:`<p class="small">Si solo te acuerdas de esto, ya vas bien.</p><ol class="ideas">${d.ideas.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`});
  steps.push({k:'La explicación',h:t.exp});
  if(d.ej)steps.push({k:'Ejemplos resueltos',h:`<p class="small">Lee el problema, intenta resolverlo en tu cabeza y después mira la solución.</p>`+d.ej.map((x,i)=>`<div class="ex"><div class="exn">Ejemplo ${i+1}</div><p>${esc(x.p)}</p><details><summary>Ver la solución</summary><p>${x.r.split(/ (?=\d\) )/).map(esc).join('<br>')}</p></details></div>`).join('')});
  if(d.err)steps.push({k:'Errores comunes',h:`<p class="small">Estas son las trampas en las que más se cae en los exámenes.</p><ul class="errs">${d.err.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`});
  if(d.retos)steps.push({k:'Mini-retos',h:`<p class="small">Responde en voz alta o en tu cuaderno. Luego toca para revisar.</p>`+d.retos.map((x,i)=>`<details class="reto"><summary><span class="rn">${i+1}</span>${esc(x.q)}</summary><p><b>Respuesta:</b> ${esc(x.a)}</p></details>`).join('')+(d.dato?`<div class="dato"><b>Dato curioso</b><p>${esc(d.dato)}</p></div>`:'')});
  const i=Math.max(0,Math.min(step||0,steps.length-1)),last=i===steps.length-1;
  app.innerHTML=`<div style="${colorVars(s)}"><div class="bar"><button class="back" id="exit">← Temas</button><div class="progress"><span style="width:${(i+1)/steps.length*100}%"></span></div><span class="count">${i+1}/${steps.length}</span></div>
  <div class="stepnav">${steps.map((x,j)=>`<button class="sn${j===i?' on':''}${j<i?' done':''}" data-j="${j}">${esc(x.k)}</button>`).join('')}</div>
  <article class="card exp"><div class="topic-name">${esc(s.name)} · ${esc(t.name)}</div><h2 class="et">${esc(steps[i].k)}</h2>${steps[i].h}</article>
  <div class="actions">${i>0?'<button class="btn ghost" id="prev">← Anterior</button>':''}${last?'<button class="btn" id="go">Ya estudié: presentar cuestionario →</button>':'<button class="btn" id="next">Siguiente →</button>'}</div></div>`;
  document.getElementById('exit').onclick=home;
  app.querySelectorAll('.sn').forEach(b=>b.onclick=()=>explain(tid,+b.dataset.j));
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>explain(tid,i-1);
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>explain(tid,i+1);
  const go=document.getElementById('go');if(go)go.onclick=()=>start(t.id);
  const on=app.querySelector('.sn.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});
  scrollTo(0,0);
}
let quiz;
function start(tid){
  const s=subj(),t=s.topics.find(x=>x.id===tid);
  const items=shuffle(t.qs.map(q=>({...q,type:'mc'}))).concat(t.open);
  quiz={s,t,items,i:0,tries:0,score:0,log:[]};
  ask();
}
function head(){const {s,t}=quiz,n=quiz.items.length;
  return `<div class="bar"><button class="back" id="exit">← Temas</button><div class="progress"><span style="width:${quiz.i/n*100}%"></span></div><span class="count">${quiz.i+1}/${n}</span></div>`}
function ask(){
  const {s,t}=quiz,q=quiz.items[quiz.i];
  quiz.tries=0;
  if(q.type==='open'){
    app.innerHTML=`<div style="${colorVars(s)}">${head()}
    <div class="card"><div class="topic-name">${esc(t.name)} · Pregunta abierta</div>
    ${t.ref?`<details class="refbox"><summary>Ver el cuento</summary>${t.ref}</details>`:''}<h2 class="q">${esc(q.q)}</h2>
    <label for="ans" class="small">Escribe tu respuesta con tus palabras:</label>
    <textarea id="ans" rows="4" placeholder="Escribe aquí…"></textarea>
    <div id="fb"></div><div class="actions" id="act"><button class="btn" id="show">Ver respuesta</button></div></div></div>`;
    document.getElementById('exit').onclick=home;
    document.getElementById('show').onclick=()=>{
      const mine=document.getElementById('ans').value.trim();document.getElementById('ans').readOnly=true;
      document.getElementById('fb').innerHTML=`<div class="fb model"><b>Respuesta esperada:</b> ${esc(q.a)}</div><p class="small" style="margin-top:12px">Compara tu respuesta con la esperada. ¿Cómo te fue?</p>`;
      const act=document.getElementById('act');
      act.innerHTML=`<button class="btn ghost" data-v="0">No la sabía</button><button class="btn ghost" data-v="0.5">Me faltó algo</button><button class="btn" data-v="1">La tenía bien</button>`;
      act.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;quiz.score+=v;
        if(v<1)quiz.log.push({q:q.q,a:q.a,half:v>0,open:true,mine});
        nextStep()});
    };
    return;
  }
  quiz.opts=q.o.length===2?q.o.map((x,i)=>({x,ok:i===0})).sort((a)=>a.x==="Verdadero"?-1:1):shuffle(q.o.map((x,i)=>({x,ok:i===0})));
  app.innerHTML=`<div style="${colorVars(s)}">${head()}
  <div class="card"><div class="topic-name">${esc(t.name)} · Selección múltiple</div>
  ${t.ref?`<details class="refbox"><summary>Ver el cuento</summary>${t.ref}</details>`:''}<h2 class="q">${esc(q.q)}</h2>
  <div class="opts">${quiz.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${esc(o.x)}</span></button>`).join('')}</div>
  <div id="fb"></div><div class="actions" id="act"></div></div></div>`;
  document.getElementById('exit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
}
function pick(k,btn){
  const q=quiz.items[quiz.i],o=quiz.opts[k],fb=document.getElementById('fb'),act=document.getElementById('act');
  const all=[...app.querySelectorAll('.opt')];
  if(o.ok){
    const pts=quiz.tries===0?1:0.5;quiz.score+=pts;
    if(pts<1)quiz.log.push({q:q.q,a:q.o[0],half:true});
    all.forEach((b,i)=>{b.disabled=true;if(i!==k&&!b.classList.contains('wrong'))b.classList.add('dim')});
    btn.classList.add('right');
    fb.innerHTML=`<div class="fb ok"><b>${quiz.tries===0?'¡Correcto!':'Bien, lo corregiste.'}</b> ${esc(q.e)}</div>`;
    next(act);
  }else if(quiz.tries===0){
    quiz.tries=1;btn.classList.add('wrong');btn.disabled=true;
    fb.innerHTML=`<div class="fb hint"><b>Esa no es.</b> Pista: ${esc(q.h)} Intenta otra vez.</div>`;
  }else{
    quiz.log.push({q:q.q,a:q.o[0],half:false});
    btn.classList.add('wrong');
    all.forEach((b,i)=>{b.disabled=true;if(quiz.opts[i].ok)b.classList.add('right');else if(!b.classList.contains('wrong'))b.classList.add('dim')});
    fb.innerHTML=`<div class="fb bad"><b>La respuesta era: ${esc(q.o[0])}.</b> ${esc(q.e)}</div>`;
    next(act);
  }
}
function next(act){
  const last=quiz.i===quiz.items.length-1;
  act.innerHTML=`<button class="btn" id="nx">${last?'Ver resultado':'Siguiente →'}</button>`;
  const b=document.getElementById('nx');b.focus();b.onclick=nextStep;
}
function nextStep(){if(quiz.i===quiz.items.length-1)results();else{quiz.i++;ask();scrollTo(0,0)}}
function results(){
  const {s,t,score,log}=quiz,n=quiz.items.length,p=Math.round(score/n*100);
  const key='rp_best_'+s.id+'_'+t.id,best=store.get(key);
  const sc=Math.floor(score);if(best==null||sc>best)store.set(key,sc);
  const msg=p>=90?'Muy bien preparada para la evaluación.':p>=70?'Vas bien. Repasa las preguntas de abajo.':p>=50?'Hay que reforzar varias cosas antes de la evaluación.':'Conviene volver a leer la explicación y repetir el cuestionario.';
  const fails=log.filter(x=>!x.half),halves=log.filter(x=>x.half);
  const fecha=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long'});
  const resumen=`Repaso ${s.name} · ${t.name} (${fecha})\nPuntaje: ${score} de ${n} (${p} %)\nBien a la primera: ${n-log.length}\nA medias o con pista: ${halves.length}\nNo la sabía: ${fails.length}`+(log.length?`\nReforzar:\n`+log.map(x=>'- '+x.q).join('\n'):'\nSin temas para reforzar.');
  app.innerHTML=`<div style="${colorVars(s)}"><div class="bar"><button class="back" id="exit">← Temas</button></div>
  <div class="card"><div class="topic-name">${esc(s.name)} · ${esc(t.name)}</div>
  <div class="score"><div class="ring" style="--p:${p}"><div>${p}%</div></div><div><h2>${score} de ${n} puntos</h2><p>${msg}</p><p class="small">Bien a la primera = 1 punto · con pista o a medias = ½ punto.</p></div></div>
  ${log.length?`<h3 style="font-size:18px;margin-top:8px">Para repasar</h3><ul class="review">${log.map(x=>`<li class="${x.half?'half':''}"><div class="rq">${esc(x.q)}</div>${x.open&&x.mine?`<div class="ra">Tu respuesta: ${esc(x.mine)}</div>`:''}<div class="ra">${x.half&&!x.open?'La corregiste con pista. ':''}Respuesta: ${esc(x.a)}</div></li>`).join('')}</ul>`:''}
  <div class="dad"><h3>Resumen para papá</h3><pre id="res">${esc(resumen)}</pre></div>
  <div class="actions"><button class="btn ghost" id="cp">Copiar resumen</button><button class="btn ghost" id="exp2">Repasar explicación</button><button class="btn ghost" id="again">Repetir cuestionario</button><button class="btn" id="home">Elegir otro tema</button></div>
  <p class="note" id="cpmsg" hidden></p></div></div>`;
  document.getElementById('exit').onclick=home;document.getElementById('home').onclick=home;
  document.getElementById('again').onclick=()=>start(t.id);document.getElementById('exp2').onclick=()=>explain(t.id);
  document.getElementById('cp').onclick=()=>{const m=document.getElementById('cpmsg');
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('res'));const g=getSelection();g.removeAllRanges();g.addRange(r);m.hidden=false;m.textContent='Texto seleccionado: cópialo con Ctrl+C o mantén presionado en el celular.'};
    try{navigator.clipboard.writeText(resumen).then(()=>{m.hidden=false;m.textContent='Resumen copiado. Pégalo en WhatsApp para enviárselo a papá.'},sel)}catch(e){sel()}};
  scrollTo(0,0);
}
home();
</script>
