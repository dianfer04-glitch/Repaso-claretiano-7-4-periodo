<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso 4.° Periodo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: cuaderno escolar — barra de materias arriba, tarjetas de tema, quiz de una pregunta a la vez */
:root{
  --bg:#F3F6F1; --paper:#FFFFFF; --ink:#1E2A22; --muted:#5B6B60; --line:#D8E1D6;
  --bio:#2F8F5B; --bio-soft:#E2F2E8; --math:#3C6FB6; --math-soft:#E3ECF8; --lang:#B5552F; --lang-soft:#F8E6DD; --soc:#8A6A1F; --eng:#7A4FA8; --geo:#B23A6E; --geo-soft:#F7E1EB; --fis:#1F8A99;
  --ok:#1F8A4C; --ok-soft:#DDF3E5; --bad:#C2412D; --bad-soft:#FBE4DF; --hint:#A86A00; --hint-soft:#FFF1D2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A16; --paper:#1D2520; --ink:#E7EFE9; --muted:#9DB0A3; --line:#2F3B33;
  --bio:#5CC48A; --bio-soft:#1F3428; --math:#7EA8E6; --math-soft:#1E2A3B; --lang:#E58D68; --lang-soft:#3A2419; --soc:#D2AE58; --eng:#B793E0; --geo:#E27BA6; --geo-soft:#3A1E2B; --fis:#5CC7D6;
  --ok:#5CCB8A; --ok-soft:#1C3527; --bad:#F07E6A; --bad-soft:#3A221D; --hint:#F0B64A; --hint-soft:#382C14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A16; --paper:#1D2520; --ink:#E7EFE9; --muted:#9DB0A3; --line:#2F3B33;
  --bio:#5CC48A; --bio-soft:#1F3428; --math:#7EA8E6; --math-soft:#1E2A3B; --lang:#E58D68; --lang-soft:#3A2419; --soc:#D2AE58; --eng:#B793E0; --geo:#E27BA6; --geo-soft:#3A1E2B; --fis:#5CC7D6;
  --ok:#5CCB8A; --ok-soft:#1C3527; --bad:#F07E6A; --bad-soft:#3A221D; --hint:#F0B64A; --hint-soft:#382C14; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
header.top{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-size:30px;font-weight:700}
header.top p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.tab{flex:0 0 auto;font:600 15px var(--display);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:var(--paper)}
.tab[aria-selected="true"] .dot{background:var(--paper)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.topic:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
.subject-head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.subject-head h2{font-size:24px;color:var(--c)}
.subject-head p{margin:0;color:var(--muted)}
.topics{display:grid;gap:12px}
.topic .num{font:700 20px var(--display);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--c)}
.topic h3{font-size:19px;font-weight:600}
.topic p{margin:2px 0 0;color:var(--muted);font-size:15px}
.topic .meta{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap}
.topic .meta b{display:block;font:700 18px var(--display);color:var(--ink)}
.pending{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted)}
.pending h3{color:var(--ink);font-size:19px;margin-bottom:6px}
/* quiz */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:none;border:none;color:var(--muted);font:600 15px var(--display);cursor:pointer;padding:6px 0}
.progress{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--c);transition:width .3s}
.count{font:600 15px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px}
.card .topic-name{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:8px}
.card h2.q{font-family:var(--body);font-size:20px;font-weight:700;line-height:1.4;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.opt .l{font:700 15px var(--display);flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:16px}
.fb b{font-family:var(--display)}
.fb.hint{background:var(--hint-soft);color:var(--ink);border-left:4px solid var(--hint)}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:flex-end}
.btn{font:600 16px var(--display);border-radius:12px;padding:10px 18px;cursor:pointer;border:2px solid var(--c);background:var(--c);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--c)}
/* results */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:84px;height:84px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.score h2{font-size:24px}
.score p{margin:4px 0 0;color:var(--muted)}
.review{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{background:var(--bg);border-radius:12px;padding:12px 14px;border-left:4px solid var(--bad)}
.review li.half{border-left-color:var(--hint)}
.review .rq{font-weight:700}
.review .ra{color:var(--muted);font-size:15px;margin-top:4px}
.dad{margin-top:18px;background:var(--soft);border-radius:14px;padding:14px 16px}
.dad h3{font-size:17px;margin-bottom:6px}
.dad pre{white-space:pre-wrap;font:15px/1.5 var(--body);margin:0}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.topic{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px}
.tb{min-width:0}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.small{font-size:14px;color:var(--muted)}
textarea{width:100%;font:16px/1.5 var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;resize:vertical}
textarea:focus{outline:none;border-color:var(--c)}
.fb.model{background:var(--soft);border-left:4px solid var(--c)}
.exp h2.et{font-size:24px;margin-bottom:6px}
.exp h3{font-size:19px;margin:20px 0 8px;color:var(--c)}
.exp p{margin:0 0 10px;max-width:65ch}
.xcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.xc{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.xc b{font:600 17px var(--display);color:var(--c)}
.xc i{font-size:14px;color:var(--muted)}
.story{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:14px 16px;margin:8px 0;max-width:65ch;line-height:1.6}
.refbox{margin-bottom:14px}.refbox summary{cursor:pointer;font:600 15px var(--display);color:var(--c)}
.tree{font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:8px 0}
.credit{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 28px;margin:0}
.stepnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.sn{flex:0 0 auto;font:600 13px var(--display);border:2px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.sn.done{color:var(--c);border-color:var(--soft);background:var(--soft)}
.sn.on{background:var(--c);border-color:var(--c);color:var(--paper)}
.ideas{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:i;display:grid;gap:10px}
.ideas li{counter-increment:i;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:17px}
.ideas li::before{content:counter(i);font:700 18px var(--display);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--paper)}
.ex{background:var(--bg);border-radius:12px;padding:12px 14px;margin:10px 0}
.ex p{margin:4px 0}
.exn{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ex details summary,.reto summary{cursor:pointer;font:600 15px var(--display);color:var(--c);margin-top:6px}
.ex details p{background:var(--paper);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;margin-top:8px}
.errs{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.errs li{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px}
.reto{background:var(--bg);border-radius:12px;padding:12px 14px;margin:10px 0}
.reto summary{color:var(--ink);font:600 16px var(--body);display:flex;gap:10px;align-items:flex-start;list-style:none}
.reto summary::-webkit-details-marker{display:none}
.reto .rn{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:var(--paper);font:700 14px var(--display)}
.reto[open] summary{color:var(--c)}
.reto p{margin:10px 0 0 36px}
.dato{margin-top:16px;background:var(--hint-soft);border-radius:12px;padding:12px 14px}
.dato b{font-family:var(--display);color:var(--hint)}
.dato p{margin:4px 0 0}
.tip{margin-top:16px;background:var(--hint-soft);border-left:4px solid var(--hint);border-radius:10px;padding:12px 14px}
.xt{overflow-x:auto;margin:8px 0}
.xt table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
.xt th,.xt td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.xt th{font-family:var(--display);color:var(--muted);font-weight:600}
.xt td:nth-child(2){font:700 16px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.ln{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;display:flex;flex-direction:column;line-height:1.2}
.ln small{font-weight:400;font-size:12px;color:var(--muted)}
.ln.sun{border-color:var(--hint);background:var(--hint-soft)}
.ar{color:var(--c);font-weight:700}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0 6px}
.pyr div{background:var(--c);color:var(--paper);text-align:center;border-radius:8px;padding:7px 6px;font:600 14px var(--display)}
.pyr div:nth-child(1){opacity:.55}.pyr div:nth-child(2){opacity:.7}.pyr div:nth-child(3){opacity:.85}
@media (max-width:480px){.topic{grid-template-columns:1fr}.topic .num{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<p class="credit">Panel de repaso creado por Andrés Fernández y su hija · Colegio Claretiano de Neiva · 7.° grado</p>

<script>
const SUBJECTS=[
{id:"bio",name:"Biología",c:"--bio",soft:"--bio-soft",desc:"Interacciones en los seres vivos. Lo que evalúan al volver de vacaciones.",topics:[
{id:"intra",name:"Relaciones intraespecíficas",desc:"Entre individuos de la misma especie: familiar, gregaria, colonial y competencia.",qs:[
{q:"¿Qué es una relación intraespecífica?",o:["La que ocurre entre individuos de la misma especie","La que ocurre entre individuos de especies diferentes","La relación entre un ser vivo y el clima","La relación entre una planta y el suelo"],h:"Piensa en el prefijo: «intra» significa «dentro».",e:"Intra = dentro. Es una relación dentro de la misma especie, por ejemplo entre dos chigüiros."},
{q:"Completa: cuando la relación es entre individuos de la misma especie, se denomina relación ______.",o:["intraespecífica","interespecífica","simbiótica","trófica"],h:"Ojo, esta es la que se confundió en el cuaderno. ¿«Dentro» o «entre»?",e:"Misma especie = INTRAespecífica. Diferentes especies = INTERespecífica."},
{q:"Una manada de chigüiros se junta un tiempo para buscar agua y protegerse, y luego se separa. ¿Qué tipo de asociación es?",o:["Gregaria","Colonial","Familiar","Parasitismo"],h:"La clave está en «un tiempo»: se reúnen solo temporalmente.",e:"Gregaria: los individuos se reúnen de forma temporal para desplazarse, alimentarse o protegerse."},
{q:"Los corales viven unidos físicamente y forman una gran estructura organizada. ¿Qué tipo de asociación es?",o:["Colonial","Gregaria","Familiar","Comensalismo"],h:"Fíjate en «unidos físicamente».",e:"Colonial: los individuos permanecen unidos físicamente y forman una estructura organizada."},
{q:"Una pareja de guacamayas construye un nido y cuida a sus polluelos. ¿Qué relación es?",o:["Familiar","Gregaria","Colonial","Depredación"],h:"¿Para qué se juntan? Para reproducirse y criar.",e:"Familiar: individuos que se agrupan principalmente para reproducirse y cuidar de sus crías."},
{q:"Dos gallos de una finca en Garzón pelean por el mismo territorio y las mismas gallinas. ¿Qué relación es?",o:["Competencia intraespecífica","Mutualismo","Asociación familiar","Comensalismo"],h:"Son de la misma especie y luchan por un recurso limitado.",e:"Competencia: individuos de la misma especie que se disputan un recurso limitado (alimento, territorio o pareja)."},
{q:"Una bandada de garzas vuela junta hacia el río Magdalena para alimentarse y después cada una sigue por su lado. Es una agrupación…",o:["Gregaria","Colonial","Familiar","Interespecífica"],h:"Se juntan un rato y luego se separan.",e:"Es gregaria porque la unión es temporal."},
{q:"¿Cuál es la diferencia principal entre una agrupación colonial y una gregaria?",o:["En la colonial están unidos físicamente; en la gregaria se reúnen solo por un tiempo","En la colonial son de distinta especie; en la gregaria de la misma","La colonial es para reproducirse; la gregaria para pelear","No hay diferencia, son lo mismo"],h:"Recuerda los corales y las garzas.",e:"Colonial = unidos físicamente y de forma permanente. Gregaria = reunión temporal."},
{q:"¿Cuál de estos NO es un recurso por el que compiten los individuos de una especie?",o:["El color de su pelaje","El alimento","El territorio","La pareja"],h:"La competencia es por cosas que escasean y que todos necesitan.",e:"Compiten por recursos limitados: alimento, territorio o pareja. El color no es un recurso."},
{q:"¿Cuál es un ejemplo de relación intraespecífica?",o:["Dos lobos de la misma manada cazando juntos","Un jaguar cazando un chigüiro","Una garrapata en una vaca","Una abeja en una flor de café"],h:"Busca la opción donde los dos sean del mismo tipo de animal.",e:"Los dos lobos son de la misma especie. Las otras opciones tienen especies diferentes."},
{q:"En la subienda, los bocachicos nadan juntos en grandes grupos río arriba para protegerse y reproducirse. Es una agrupación…",o:["Gregaria","Colonial","Parasitaria","Comensal"],h:"Se agrupan durante la temporada y no quedan pegados unos a otros.",e:"Los cardúmenes son agrupaciones gregarias: se reúnen temporalmente para desplazarse y protegerse."},
{q:"Verdadero o falso: en las agrupaciones coloniales los individuos se separan cuando quieren.",o:["Falso","Verdadero"],h:"¿Un coral puede despegarse y irse nadando?",e:"Falso. En las colonias los individuos permanecen unidos físicamente."},
{q:"¿Por qué la competencia entre individuos de la misma especie suele ser muy fuerte?",o:["Porque necesitan exactamente los mismos recursos","Porque son de especies distintas","Porque siempre se comen entre ellos","Porque viven en lugares diferentes"],h:"Dos vacas del mismo potrero, ¿qué comen?",e:"Al ser iguales, necesitan el mismo alimento, territorio y pareja, por eso chocan más."},
{q:"El prefijo «intra» de intraespecífica significa:",o:["Dentro","Entre","Contra","Fuera"],h:"Como en «intramuros»: dentro de los muros.",e:"Intra = dentro de la misma especie."},
{q:"¿Cuál de estas NO es una relación intraespecífica?",o:["Comensalismo","Asociación familiar","Asociación gregaria","Competencia entre individuos de la misma especie"],h:"Una de estas ocurre entre especies diferentes.",e:"El comensalismo es interespecífico: ocurre entre dos especies distintas."}
]},
{id:"inter",name:"Relaciones interespecíficas",desc:"Entre especies diferentes: comensalismo, mutualismo, simbiosis, depredación, parasitismo y competencia.",qs:[
{q:"¿Qué es una relación interespecífica?",o:["La que ocurre entre organismos de especies diferentes","La que ocurre entre individuos de la misma especie","La relación entre padres e hijos","La que solo ocurre entre plantas"],h:"«Inter» significa «entre», como en interescolar.",e:"Inter = entre especies distintas, por ejemplo una vaca y una garrapata."},
{q:"La garcita bueyera camina junto a las vacas y se come los insectos que ellas espantan al pisar. A la vaca no le pasa nada. ¿Qué relación es?",o:["Comensalismo","Mutualismo","Parasitismo","Depredación"],h:"Una gana y a la otra ni le va bien ni mal.",e:"Comensalismo: una especie se beneficia sin afectar a la otra."},
{q:"La abeja toma el néctar de la flor del cafeto y, al mismo tiempo, lleva el polen que ayuda a la flor a formar el fruto. ¿Qué relación es?",o:["Mutualismo","Comensalismo","Parasitismo","Competencia"],h:"¿Quién gana aquí? Mira a las dos.",e:"Mutualismo: las dos especies obtienen beneficio."},
{q:"Una garrapata vive sobre una vaca y se alimenta de su sangre, debilitándola. ¿Qué relación es?",o:["Parasitismo","Mutualismo","Comensalismo","Asociación colonial"],h:"Uno gana a costa de perjudicar al otro, pero sin comérselo de una vez.",e:"Parasitismo: un organismo obtiene recursos de otro al que perjudica."},
{q:"Un jaguar caza y se come un chigüiro. ¿Qué relación es?",o:["Depredación","Parasitismo","Comensalismo","Mutualismo"],h:"Lo captura y lo consume.",e:"Depredación: un organismo captura y consume a otro."},
{q:"En la depredación, el animal que es capturado y comido se llama:",o:["Presa","Depredador","Hospedero","Parásito"],h:"El jaguar es el depredador. ¿Y el chigüiro?",e:"La presa es el organismo capturado. El que caza es el depredador."},
{q:"En el parasitismo, el organismo que es perjudicado (por ejemplo la vaca con garrapatas) se llama:",o:["Hospedero","Presa","Productor","Comensal"],h:"Es el que «hospeda» al parásito.",e:"El hospedero es el organismo sobre o dentro del cual vive el parásito."},
{q:"¿Qué es la simbiosis?",o:["Una asociación estrecha y permanente entre organismos de diferente especie, con dependencia","Una pelea entre animales de la misma especie","Cuando un animal caza a otro","Una agrupación temporal para migrar"],h:"Piensa en «estrecha», «permanente» y «dependencia».",e:"Simbiosis: asociación estrecha y permanente entre especies diferentes que dependen una de la otra. Ej.: los líquenes (hongo + alga)."},
{q:"En el mutualismo:",o:["Ambas especies se benefician","Una se beneficia y la otra se perjudica","Una se beneficia y a la otra no le pasa nada","Ambas se perjudican"],h:"«Mutuo» quiere decir que va para los dos lados.",e:"Mutualismo = beneficio mutuo, las dos ganan."},
{q:"En el comensalismo:",o:["Una especie se beneficia y la otra no se afecta","Las dos especies se benefician","Una especie se come a la otra","Una especie vive a costa de dañar a la otra"],h:"Recuerda la garcita bueyera y la vaca.",e:"Comensalismo: una gana y la otra queda igual."},
{q:"Un gavilán y una lechuza cazan los mismos ratones en un cultivo de arroz del Huila. ¿Qué relación hay entre el gavilán y la lechuza?",o:["Competencia interespecífica","Mutualismo","Asociación gregaria","Comensalismo"],h:"Son especies distintas y quieren el mismo recurso.",e:"Competencia interespecífica: especies diferentes que se disputan un recurso limitado."},
{q:"El pez rémora se pega al tiburón y come los restos de comida que él deja, sin hacerle daño. ¿Qué relación es?",o:["Comensalismo","Parasitismo","Depredación","Mutualismo"],h:"¿Al tiburón le pasa algo?",e:"Comensalismo: la rémora se beneficia y al tiburón no le afecta."},
{q:"Las bacterias del intestino humano nos ayudan a digerir y a cambio reciben alimento y un lugar donde vivir. ¿Qué relación es?",o:["Mutualismo","Parasitismo","Comensalismo","Competencia"],h:"¿Ganan las bacterias? ¿Ganamos nosotros?",e:"Mutualismo: las dos partes se benefician."},
{q:"¿Cuál es la diferencia entre parasitismo y depredación?",o:["El parásito vive a costa del hospedero sin matarlo de inmediato; el depredador captura y consume a su presa","No hay diferencia","En el parasitismo las dos especies ganan","El depredador siempre es más pequeño que su presa"],h:"Compara la garrapata con el jaguar.",e:"El parásito se aprovecha por un tiempo del hospedero; el depredador lo caza y se lo come."},
{q:"Un piojo vive en la cabeza de una persona y se alimenta de su sangre. ¿Qué relación es y quién es el hospedero?",o:["Parasitismo; la persona es el hospedero","Mutualismo; el piojo es el hospedero","Depredación; la persona es la presa","Comensalismo; el piojo es el hospedero"],h:"Uno gana y el otro sale perjudicado. ¿Quién hospeda a quién?",e:"Es parasitismo y la persona es el hospedero."}
]},
{id:"trofica",name:"Cadena alimenticia y pirámide trófica",desc:"Productores, consumidores, descomponedores y cómo se pasa la energía.",qs:[
{q:"¿Qué muestra una cadena alimenticia?",o:["Quién se come a quién y cómo pasa la energía de un ser vivo a otro","Los animales que viven en grupo","Los lugares donde vive cada animal","Cuántos años vive cada especie"],h:"Piensa en las flechas: pasto → vaca → ser humano.",e:"Muestra el paso de energía y materia: quién se alimenta de quién."},
{q:"¿Qué son los productores?",o:["Seres vivos que fabrican su propio alimento con la luz del sol, como las plantas","Animales que comen plantas","Bacterias y hongos que descomponen restos","Animales que cazan a otros"],h:"¿Quién hace su comida con fotosíntesis?",e:"Los productores (plantas y algas) fabrican su alimento por fotosíntesis. Son la base de toda cadena."},
{q:"¿De dónde viene la energía original de casi todas las cadenas alimenticias?",o:["Del sol","Del suelo","Del agua","De los animales carnívoros"],h:"Las plantas la necesitan para la fotosíntesis.",e:"El sol da la energía que los productores convierten en alimento."},
{q:"En la cadena pasto → vaca → ser humano, ¿qué es la vaca?",o:["Consumidor primario (herbívoro)","Productor","Consumidor secundario","Descomponedor"],h:"Come directamente al productor.",e:"El consumidor primario se alimenta del productor; es herbívoro."},
{q:"En la cadena pasto → saltamontes → rana → serpiente → águila, ¿qué es la rana?",o:["Consumidor secundario","Consumidor primario","Productor","Consumidor terciario"],h:"Cuenta: el pasto es el productor, el saltamontes es el primario…",e:"La rana se come al consumidor primario (el saltamontes), así que es consumidor secundario."},
{q:"En la misma cadena (pasto → saltamontes → rana → serpiente → águila), ¿qué es la serpiente?",o:["Consumidor terciario","Consumidor secundario","Consumidor primario","Descomponedor"],h:"Va un nivel más arriba que la rana.",e:"Productor → primario → secundario → terciario. La serpiente es terciaria."},
{q:"¿Qué hacen los descomponedores?",o:["Transforman los restos de seres vivos en materia que luego usan los productores","Fabrican su alimento con la luz del sol","Cazan a los consumidores secundarios","Polinizan las flores"],h:"Recuerda lo que copió en el cuaderno: bacterias y hongos.",e:"Bacterias y hongos descomponen restos orgánicos e inorgánicos y devuelven nutrientes al suelo para los productores."},
{q:"¿Cuáles de estos son descomponedores?",o:["Bacterias y hongos","Plantas y algas","Vacas y caballos","Águilas y serpientes"],h:"Piensa en lo que hace que una fruta caída se pudra.",e:"Bacterias y hongos son los descomponedores."},
{q:"En una cadena alimenticia, las flechas apuntan:",o:["Del que es comido hacia el que lo come (dirección de la energía)","Del que come hacia el que es comido","Siempre hacia el sol","Hacia los descomponedores solamente"],h:"La flecha muestra hacia dónde va la energía: pasto → vaca.",e:"La flecha sigue la energía: va del alimento al que se alimenta."},
{q:"En la pirámide trófica, ¿qué va en la base?",o:["Los productores","Los consumidores terciarios","Los descomponedores","Los depredadores grandes"],h:"La base es lo que sostiene a todos los demás.",e:"Los productores van en la base porque son los más abundantes y los que tienen más energía."},
{q:"Al subir de un nivel a otro en la pirámide trófica, la energía disponible:",o:["Disminuye","Aumenta","Se queda igual","Desaparece por completo en el segundo nivel"],h:"Cada ser vivo gasta energía en moverse, respirar y crecer.",e:"Disminuye: solo pasa una pequeña parte (cerca del 10 %) al siguiente nivel."},
{q:"¿Por qué en un ecosistema hay muchos menos jaguares que chigüiros?",o:["Porque la energía disminuye en cada nivel y no alcanza para muchos depredadores","Porque los jaguares no se reproducen","Porque los chigüiros son productores","Porque los jaguares comen pasto"],h:"Piensa en la forma de la pirámide.",e:"Hacia arriba la energía es menor, por eso caben menos organismos en los niveles altos."},
{q:"Si en un potrero desaparecen casi todas las ranas, ¿qué pasaría con los saltamontes?",o:["Aumentarían, porque ya no tienen quién se los coma","Disminuirían","No les pasaría nada","Se volverían carnívoros"],h:"Las ranas se comen a los saltamontes.",e:"Sin su depredador, los saltamontes aumentan. Un cambio en un eslabón afecta a toda la cadena."},
{q:"¿Cuál es el orden correcto de esta cadena alimenticia?",o:["Maíz → gallina → zorro","Zorro → gallina → maíz","Gallina → maíz → zorro","Maíz → zorro → gallina"],h:"Empieza siempre por el productor.",e:"Productor (maíz) → consumidor primario (gallina) → consumidor secundario (zorro)."},
{q:"¿En qué se diferencian la cadena alimenticia y la pirámide trófica?",o:["La cadena muestra quién se come a quién en línea; la pirámide muestra los niveles y cómo disminuye la energía","Son temas que no tienen relación","La pirámide solo incluye plantas","La cadena solo incluye descomponedores"],h:"Una es en fila con flechas; la otra es por pisos.",e:"Muestran los mismos niveles de dos formas: la cadena en secuencia y la pirámide con la cantidad de energía en cada nivel."}
]}
]},
{id:"mat",name:"Matemáticas",c:"--math",soft:"--math-soft",desc:"Unidad 4 · Introducción al álgebra. Profe Elian Puentes · 4 horas semanales.",topics:[
{id:"lenguaje",name:"Lenguaje algebraico",desc:"Pasar frases del español a letras y números, y al revés.",
exp:`<h3>¿Qué es?</h3><p>El <b>lenguaje algebraico</b> usa <b>letras, números y signos</b> para escribir frases matemáticas de forma corta. La letra (x, a, n…) representa un número que no conocemos.</p>
<h3>Diccionario para traducir</h3><p class="small">x = «un número»</p>
<div class="xt"><table><thead><tr><th>En palabras</th><th>En álgebra</th></tr></thead><tbody>
<tr><td>El doble de un número</td><td>2x</td></tr>
<tr><td>El triple de un número</td><td>3x</td></tr>
<tr><td>La mitad de un número</td><td>x/2</td></tr>
<tr><td>La tercera parte de un número</td><td>x/3</td></tr>
<tr><td>El cuadrado de un número</td><td>x²</td></tr>
<tr><td>El cubo de un número</td><td>x³</td></tr>
<tr><td>Un número aumentado en 5 (más 5)</td><td>x + 5</td></tr>
<tr><td>Un número disminuido en 5 (menos 5)</td><td>x − 5</td></tr>
<tr><td>La suma de dos números</td><td>a + b</td></tr>
<tr><td>El producto de dos números</td><td>a · b = ab</td></tr>
<tr><td>Un número par</td><td>2n</td></tr>
</tbody></table></div>
<h3>Ejemplo del día a día</h3><p>Si un tamal en Neiva cuesta <b>p</b> pesos, 3 tamales cuestan <b>3p</b>. Si Mariana tiene <b>x</b> años, dentro de 5 años tendrá <b>x + 5</b>.</p>
<div class="tip"><b>Ojo:</b> «el doble» (2x) no es lo mismo que «el cuadrado» (x²). El doble de 5 es 10; el cuadrado de 5 es 25.</div>`,
qs:[
{q:"¿Qué es el lenguaje algebraico?",o:["Una forma de escribir frases matemáticas usando letras, números y signos","Un idioma que se habla en otros países","Una forma de escribir solo con números","Una manera de dibujar figuras geométricas"],h:"Piensa en qué usamos para escribir «el doble de un número».",e:"Usa letras (que representan números desconocidos), números y signos de operación."},
{q:"«El doble de un número» se escribe:",o:["2x","x²","x + 2","x/2"],h:"Doble = multiplicar por 2.",e:"El doble es multiplicar por 2: 2x."},
{q:"«El cuadrado de un número» se escribe:",o:["x²","2x","x + 2","x/2"],h:"Cuadrado = el número multiplicado por sí mismo.",e:"El cuadrado es x·x = x²."},
{q:"«Un número aumentado en 5» se escribe:",o:["x + 5","5x","x − 5","x⁵"],h:"Aumentar = sumar.",e:"Aumentado en 5 = x + 5."},
{q:"«La mitad de un número» se escribe:",o:["x/2","2x","x − 2","x²"],h:"La mitad es dividir entre 2.",e:"La mitad es x ÷ 2 = x/2."},
{q:"«El triple de un número, disminuido en 4» se escribe:",o:["3x − 4","4 − 3x","x³ − 4","3x + 4"],h:"Primero el triple, luego le restas 4.",e:"Triple = 3x; disminuido en 4 = − 4. Queda 3x − 4."},
{q:"«La suma de dos números» se escribe:",o:["a + b","ab","2a","a − b"],h:"Como son dos números distintos, usa dos letras distintas.",e:"Dos números diferentes se representan con dos letras: a + b."},
{q:"¿Qué dice en palabras la expresión 2x + 1?",o:["El doble de un número aumentado en uno","El cuadrado de un número más uno","Un número aumentado en dos","La mitad de un número más uno"],h:"2x es el doble. ¿Qué le pasa después?",e:"2x = el doble; + 1 = aumentado en uno."},
{q:"¿Cómo se representa un número par cualquiera?",o:["2n","n + 2","n²","2n + 1"],h:"Los pares son múltiplos de 2.",e:"Todo número par es 2 por otro número: 2n. (2n + 1 representa un impar.)"},
{q:"Mariana tiene x años. ¿Qué expresión representa su edad dentro de 5 años?",o:["x + 5","x − 5","5x","x/5"],h:"Dentro de 5 años tendrá más edad.",e:"En el futuro se suma: x + 5."},
{q:"Un tamal en Neiva cuesta p pesos. ¿Cuánto cuestan 3 tamales?",o:["3p","p + 3","p³","p/3"],h:"Es el mismo precio repetido 3 veces.",e:"3 veces p = 3p."}],
open:[
{q:"Escribe en lenguaje algebraico: «el cubo de un número disminuido en 7».",a:"x³ − 7"},
{q:"Escribe en lenguaje algebraico: «la tercera parte de un número más el doble del mismo número».",a:"x/3 + 2x"},
{q:"Escribe en palabras la expresión 5x − 3.",a:"El quíntuple (cinco veces) de un número disminuido en 3."},
{q:"Un bus sale de Neiva hacia Pitalito con x pasajeros. En Garzón se suben 8 y se bajan 3. Escribe la expresión de cuántos pasajeros lleva.",a:"x + 8 − 3, que es lo mismo que x + 5."}]},
{id:"termino",name:"Término algebraico",desc:"Partes de un término: signo, coeficiente, parte literal, exponente y grado.",
exp:`<h3>¿Qué es?</h3><p>Un <b>término algebraico</b> es una sola expresión formada por números y letras que se <b>multiplican</b> entre sí, sin sumas ni restas en medio. Ej.: 5a², −3m²n, x.</p>
<h3>Sus partes</h3><p>Tomemos el término <b>−7x³</b>:</p>
<div class="xcards">
<div class="xc"><b>Signo</b><span>Positivo (+) o negativo (−).</span><i>Aquí: negativo (−)</i></div>
<div class="xc"><b>Coeficiente</b><span>El número que multiplica a las letras.</span><i>Aquí: 7</i></div>
<div class="xc"><b>Parte literal</b><span>Las letras con sus exponentes.</span><i>Aquí: x³</i></div>
<div class="xc"><b>Exponente</b><span>El número pequeño arriba de la letra.</span><i>Aquí: 3</i></div></div>
<h3>Grado de un término</h3><p>Es la <b>suma de los exponentes</b> de sus letras.</p>
<div class="xt"><table><thead><tr><th>Término</th><th>Exponentes</th><th>Grado</th></tr></thead><tbody>
<tr><td>4x³</td><td>3</td><td>3</td></tr>
<tr><td>2a²b³</td><td>2 + 3</td><td>5</td></tr>
<tr><td>6xy</td><td>1 + 1</td><td>2</td></tr>
</tbody></table></div>
<div class="tip"><b>Lo invisible también cuenta:</b> si no ves coeficiente, es <b>1</b> (x = 1x). Si no ves exponente, es <b>1</b> (y = y¹). Si no ves signo, es <b>positivo</b>.</div>`,
qs:[
{q:"¿Cuáles son las partes de un término algebraico?",o:["Signo, coeficiente, parte literal y exponente","Suma, resta, multiplicación y división","Numerador y denominador","Base, altura y área"],h:"Mira el término −7x³ en la explicación.",e:"Un término tiene signo, coeficiente, parte literal y exponente."},
{q:"En el término 5a², ¿cuál es el coeficiente?",o:["5","a","2","a²"],h:"Es el número que multiplica a la letra.",e:"El coeficiente es el número: 5."},
{q:"En el término 5a², ¿cuál es la parte literal?",o:["a²","5","2","5a"],h:"Literal viene de «letra».",e:"La parte literal son las letras con sus exponentes: a²."},
{q:"En el término 8x⁴, ¿cuál es el exponente?",o:["4","8","x","32"],h:"Es el número pequeño de arriba.",e:"El exponente es 4."},
{q:"¿Qué signo tiene el término −3m²n?",o:["Negativo","Positivo","No tiene signo","Depende de m"],h:"Mira lo que está antes del 3.",e:"Tiene el signo menos, así que es negativo."},
{q:"¿Cuál es el coeficiente del término x?",o:["1","0","x","No tiene"],h:"¿Cuántas x hay?",e:"Cuando no se ve el número, el coeficiente es 1, porque x = 1·x."},
{q:"¿Cuál es el grado del término 4x³?",o:["3","4","7","12"],h:"El grado se mira en los exponentes, no en el coeficiente.",e:"Solo hay un exponente, el 3. El grado es 3."},
{q:"¿Cuál es el grado del término 2a²b³?",o:["5","6","3","2"],h:"Suma los exponentes de todas las letras.",e:"2 + 3 = 5."},
{q:"¿Cuál es el grado del término 6xy?",o:["2","1","6","0"],h:"¿Qué exponente tienen x y y si no se ve ninguno?",e:"x¹ y¹: 1 + 1 = 2."},
{q:"¿Cuál de estos es UN solo término algebraico?",o:["7ab²","3x + 2","a − b","x² + x + 1"],h:"Un término no tiene sumas ni restas en medio.",e:"7ab² es un solo término. Las demás tienen + o − separando términos."},
{q:"¿Cuál es el exponente de y en el término 9y?",o:["1","0","9","No tiene"],h:"Cuando el exponente no se ve…",e:"Si no se ve el exponente, es 1: y = y¹."}],
open:[
{q:"Escribe las partes del término −6a³b²: signo, coeficiente, parte literal y grado.",a:"Signo: negativo. Coeficiente: 6. Parte literal: a³b². Grado: 3 + 2 = 5."},
{q:"Escribe un término algebraico con coeficiente 3, con dos letras diferentes y de grado 4.",a:"Ejemplos válidos: 3x²y², 3a³b, 3mb³. Lo importante es coeficiente 3, dos letras y que los exponentes sumen 4."},
{q:"¿Por qué decimos que el coeficiente de x es 1?",a:"Porque x es lo mismo que 1·x. El 1 no se escribe, pero está ahí."},
{q:"Explica cómo se calcula el grado de 5x²y³z.",a:"Se suman los exponentes de las letras: x tiene 2, y tiene 3, z tiene 1. 2 + 3 + 1 = 6. El grado es 6."}]},
{id:"expresiones",name:"Expresiones algebraicas y su clasificación",desc:"Qué es una expresión, cuántos términos tiene y si es monomio, binomio, trinomio o polinomio.",
exp:`<h3>¿Qué es una expresión algebraica?</h3><p>Es una combinación de <b>números y letras</b> unidos por <b>signos de operación</b> (+, −, ·, ÷, potencias). Puede tener uno o varios términos. Los <b>términos se separan con los signos + y −</b>.</p>
<p>Ej.: en <b>4m − 2n + 6</b> hay 3 términos: 4m, −2n y 6.</p>
<h3>Clasificación según el número de términos</h3>
<div class="xt"><table><thead><tr><th>Nombre</th><th>Términos</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Monomio</b></td><td>1</td><td>7a²b</td></tr>
<tr><td><b>Binomio</b></td><td>2</td><td>3x + 5</td></tr>
<tr><td><b>Trinomio</b></td><td>3</td><td>x² + 2x − 8</td></tr>
<tr><td><b>Polinomio</b></td><td>4 o más</td><td>a + b + c + d</td></tr>
</tbody></table></div>
<p class="small">«Mono» = uno, «bi» = dos, «tri» = tres, «poli» = muchos. Como en monociclo, bicicleta y triciclo.</p>
<h3>Grado de una expresión</h3><p>Es el <b>mayor grado</b> entre sus términos. En x³ + 2x − 1 los grados son 3, 1 y 0: el grado de la expresión es <b>3</b>.</p>
<div class="tip"><b>Trampa común:</b> 2ab es un <b>monomio</b>, aunque tenga dos letras. Las letras están multiplicando, no separadas por + o −.</div>`,
qs:[
{q:"¿Qué es una expresión algebraica?",o:["Una combinación de números y letras unidos por signos de operación","Una frase escrita solo con palabras","Un número sin letras","Una figura geométrica"],h:"Piensa en 3x + 5.",e:"Combina números, letras y signos de operación."},
{q:"La expresión 3x + 5 es un:",o:["Binomio","Monomio","Trinomio","Polinomio de 4 términos"],h:"Cuenta los términos separados por + o −.",e:"Tiene 2 términos (3x y 5): es un binomio."},
{q:"La expresión 7a²b es un:",o:["Monomio","Binomio","Trinomio","Polinomio"],h:"¿Hay algún + o − separando?",e:"Es un solo término: monomio."},
{q:"La expresión x² + 2x − 8 es un:",o:["Trinomio","Binomio","Monomio","Término"],h:"Cuenta: x², 2x, 8.",e:"Tiene 3 términos: trinomio."},
{q:"La expresión a + b + c + d es un:",o:["Polinomio","Trinomio","Binomio","Monomio"],h:"Tiene más de tres términos.",e:"Con 4 o más términos se llama polinomio."},
{q:"¿Cuántos términos tiene 4m − 2n + 6?",o:["3","2","4","6"],h:"Cuenta las partes separadas por + o −.",e:"4m, −2n y 6: son 3 términos."},
{q:"¿Qué separa los términos en una expresión algebraica?",o:["Los signos + y −","Los signos de multiplicación","Los paréntesis siempre","Los exponentes"],h:"En 3x + 5, ¿qué hay entre 3x y 5?",e:"Los términos se separan con + y −. La multiplicación los une en un solo término."},
{q:"¿Cuál de estas expresiones es un binomio?",o:["5x − y","5xy","5x + y − 1","5"],h:"Busca la que tenga exactamente 2 términos.",e:"5x − y tiene 2 términos. 5xy y 5 son monomios; 5x + y − 1 es trinomio."},
{q:"¿Cuál es el grado de la expresión x³ + 2x − 1?",o:["3","1","4","6"],h:"Busca el término con el exponente más grande.",e:"El grado de la expresión es el mayor grado de sus términos: 3."},
{q:"¿Por qué 2ab es un monomio y no un binomio?",o:["Porque es un solo término: las letras están multiplicando","Porque tiene dos letras","Porque el 2 no cuenta","Porque no tiene exponentes"],h:"¿Qué separa los términos?",e:"No hay + ni − que separe, así que es un solo término."},
{q:"¿Cuál de estos es un monomio de grado 2?",o:["6x²","x + 2","2x","x³"],h:"Un solo término con exponente 2.",e:"6x² es un término y su grado es 2."}],
open:[
{q:"Escribe un ejemplo de monomio, uno de binomio y uno de trinomio.",a:"Ejemplos: monomio 4x; binomio a + 3; trinomio x² + x + 1. Vale cualquier ejemplo con 1, 2 y 3 términos."},
{q:"Clasifica la expresión 2x²y − 5xy + 3y − 1 y di cuántos términos tiene.",a:"Tiene 4 términos (2x²y, −5xy, 3y y −1), así que es un polinomio."},
{q:"¿Cuál es el grado del polinomio 4a³ + 2a⁵ − a? Explica.",a:"Los grados de los términos son 3, 5 y 1. El mayor es 5, así que el grado del polinomio es 5."},
{q:"¿Cuál es la diferencia entre un término y una expresión algebraica?",a:"Un término es una sola parte sin sumas ni restas en medio (ej. 3x²). Una expresión puede tener uno o varios términos unidos por + o − (ej. 3x² + 2x)."}]},
{id:"valor",name:"Valor numérico",desc:"Reemplazar las letras por números y resolver.",
exp:`<h3>¿Qué es?</h3><p>El <b>valor numérico</b> de una expresión es el resultado que se obtiene al <b>reemplazar las letras por los números dados</b> y hacer las operaciones.</p>
<h3>Paso a paso</h3><p>Hallar el valor de <b>3x + 2</b> si <b>x = 4</b>:</p>
<div class="chain"><span class="ln">3x + 2<small>Expresión</small></span><span class="ar">→</span><span class="ln">3(4) + 2<small>Reemplazo</small></span><span class="ar">→</span><span class="ln">12 + 2<small>Multiplico</small></span><span class="ar">→</span><span class="ln sun">14<small>Resultado</small></span></div>
<h3>Orden de las operaciones</h3><p>1.° potencias · 2.° multiplicaciones y divisiones · 3.° sumas y restas.</p>
<p>Ej.: <b>4m²</b> con m = 2 → primero la potencia: 2² = 4 → luego 4 · 4 = <b>16</b>. (No es (4·2)² = 64.)</p>
<h3>Con dos letras</h3><p><b>2x + 3y</b> con x = 1, y = 2 → 2(1) + 3(2) = 2 + 6 = <b>8</b>.</p>
<div class="tip"><b>Truco:</b> al reemplazar, pon el número entre <b>paréntesis</b>. Así no te equivocas con los signos negativos: si x = −2, entonces 3x = 3(−2) = −6.</div>`,
qs:[
{q:"¿Qué es el valor numérico de una expresión algebraica?",o:["El resultado de reemplazar las letras por números dados y hacer las operaciones","El número de términos que tiene","El exponente más grande","El coeficiente del primer término"],h:"Piensa en lo que haces con 3x + 2 si x = 4.",e:"Se reemplazan las letras por los números y se resuelve."},
{q:"¿Cuál es el valor numérico de 3x + 2 si x = 4?",o:["14","9","34","12"],h:"3 por 4, y luego más 2.",e:"3(4) + 2 = 12 + 2 = 14."},
{q:"¿Cuál es el valor numérico de 2a − 5 si a = 3?",o:["1","11","−1","6"],h:"Primero 2 por 3.",e:"2(3) − 5 = 6 − 5 = 1."},
{q:"¿Cuál es el valor numérico de x² si x = 5?",o:["25","10","7","52"],h:"El cuadrado es el número por sí mismo, no por 2.",e:"5² = 5 · 5 = 25."},
{q:"¿Cuál es el valor numérico de 4m² si m = 2?",o:["16","64","12","10"],h:"Primero la potencia, después multiplicas por 4.",e:"2² = 4; luego 4 · 4 = 16."},
{q:"¿Cuál es el valor numérico de a + b si a = 7 y b = −2?",o:["5","9","−9","−5"],h:"Sumar un negativo es como restar.",e:"7 + (−2) = 7 − 2 = 5."},
{q:"¿Cuál es el valor numérico de 2x + 3y si x = 1 y y = 2?",o:["8","7","6","13"],h:"Reemplaza cada letra por su número.",e:"2(1) + 3(2) = 2 + 6 = 8."},
{q:"¿Cuál es el valor numérico de x² + x si x = 3?",o:["12","9","6","15"],h:"Primero 3², luego súmale 3.",e:"3² + 3 = 9 + 3 = 12."},
{q:"El perímetro de un cuadrado es 4L. Si el lado L mide 6 cm, ¿cuánto mide el perímetro?",o:["24 cm","10 cm","36 cm","46 cm"],h:"Reemplaza L por 6.",e:"4(6) = 24 cm."},
{q:"Si un tamal cuesta p = 3.500 pesos, ¿cuánto vale la expresión 3p?",o:["10.500 pesos","3.503 pesos","7.000 pesos","35.003 pesos"],h:"3 veces 3.500.",e:"3 · 3.500 = 10.500 pesos."},
{q:"¿Cuál es el valor numérico de 5 − 2x si x = 4?",o:["−3","3","12","−13"],h:"2 por 4 es 8. ¿Cuánto es 5 − 8?",e:"5 − 2(4) = 5 − 8 = −3."}],
open:[
{q:"Halla el valor numérico de 2x² − 3x + 1 si x = 2. Escribe los pasos.",a:"2(2)² − 3(2) + 1 = 2(4) − 6 + 1 = 8 − 6 + 1 = 3."},
{q:"Si a = 3 y b = 2, halla el valor de a² + 2ab + b².",a:"3² + 2(3)(2) + 2² = 9 + 12 + 4 = 25."},
{q:"Un taxi cobra 5.000 pesos de arranque más 1.200 pesos por cada kilómetro: 5.000 + 1.200k. ¿Cuánto cuesta un viaje de 6 km?",a:"5.000 + 1.200(6) = 5.000 + 7.200 = 12.200 pesos."},
{q:"Juan dice que el valor de 3x² con x = 2 es 36. ¿Dónde está su error y cuál es la respuesta correcta?",a:"Juan multiplicó primero 3 · 2 = 6 y luego elevó al cuadrado (6² = 36). Primero va la potencia: 2² = 4, y luego 3 · 4 = 12. La respuesta correcta es 12."}]}
]},
{id:"geo",name:"Geometría",c:"--geo",soft:"--geo-soft",desc:"Estadística · Introducción a la probabilidad. Profe Karla Tirado.",topics:[
{id:"experimentos",name:"Experimentos aleatorios y deterministas",desc:"¿Se puede saber el resultado antes de hacerlo o depende del azar?",
exp:`<h3>Dos tipos de experimentos</h3>
<div class="xcards">
<div class="xc"><b>Determinista</b><span>Sabes el resultado <u>antes</u> de hacerlo. Siempre da lo mismo.</span><i>Soltar una piedra: cae. Mezclar pintura amarilla y azul: da verde. Calentar hielo: se derrite.</i></div>
<div class="xc"><b>Aleatorio</b><span>Conoces los resultados <u>posibles</u>, pero no puedes saber cuál va a salir. Depende del azar.</span><i>Lanzar una moneda o un dado, sacar una balota, el marcador del Atlético Huila el domingo.</i></div></div>
<h3>Cómo reconocer uno aleatorio</h3><p>1. Se puede repetir en las mismas condiciones. 2. Se conocen todos los resultados posibles. 3. No se puede predecir cuál saldrá.</p>
<div class="tip"><b>Pregunta clave:</b> «¿Puedo estar segura del resultado antes de hacerlo?» Si la respuesta es <b>sí</b>, es determinista. Si es <b>no</b>, es aleatorio.</div>`,
qs:[
{q:"¿Qué es un experimento aleatorio?",o:["Aquel cuyo resultado no se puede predecir con certeza","Aquel que siempre da el mismo resultado","Un experimento de laboratorio","Un experimento que no tiene resultados"],h:"Aleatorio = depende del azar.",e:"En un experimento aleatorio se conocen los resultados posibles, pero no cuál saldrá."},
{q:"¿Qué es un experimento determinista?",o:["Aquel cuyo resultado se conoce antes de hacerlo","Aquel que depende de la suerte","Aquel que no se puede repetir","Aquel que tiene muchos resultados posibles"],h:"Está «determinado» de antemano.",e:"En el determinista el resultado siempre es el mismo y se sabe antes."},
{q:"Lanzar una moneda al aire es un experimento:",o:["Aleatorio","Determinista","Imposible","Ninguno"],h:"¿Sabes si caerá cara o sello?",e:"No se puede saber si saldrá cara o sello: es aleatorio."},
{q:"Soltar una piedra desde la ventana es un experimento:",o:["Determinista","Aleatorio","Imposible","De azar"],h:"¿Hay alguna duda de qué pasará?",e:"Siempre cae al suelo por la gravedad: es determinista."},
{q:"Sacar sin mirar una balota de una bolsa con balotas de colores es:",o:["Aleatorio","Determinista","Seguro","Imposible"],h:"Sin mirar, ¿sabes qué color sacarás?",e:"No se sabe qué color saldrá: es aleatorio."},
{q:"Mezclar pintura amarilla con pintura azul es un experimento:",o:["Determinista","Aleatorio","De azar","Imposible"],h:"¿Qué color sale siempre?",e:"Siempre da verde: es determinista."},
{q:"El resultado del próximo partido del Atlético Huila es un experimento:",o:["Aleatorio","Determinista","Seguro","Ya conocido"],h:"¿Alguien sabe con certeza quién va a ganar?",e:"Puede ganar, empatar o perder; no se sabe: es aleatorio."},
{q:"Calentar un cubo de hielo al sol en Neiva es un experimento:",o:["Determinista","Aleatorio","De azar","Imposible"],h:"¿Qué le pasa siempre al hielo con calor?",e:"Siempre se derrite: es determinista."},
{q:"¿Cuál de estas es una característica de un experimento aleatorio?",o:["Se conocen los resultados posibles, pero no cuál saldrá","Siempre da el mismo resultado","No se puede repetir nunca","No tiene resultados posibles"],h:"Piensa en el dado.",e:"Sabemos que el dado da de 1 a 6, pero no cuál número saldrá."},
{q:"¿Por qué lanzar un dado es aleatorio, si sabemos que saldrá un número del 1 al 6?",o:["Porque sabemos los posibles resultados, pero no cuál exactamente saldrá","Porque siempre sale el 6","Porque el dado tiene puntos","Porque es un juego"],h:"Diferencia entre «posibles» y «el que sale».",e:"Conocer las opciones no significa saber cuál saldrá."},
{q:"¿Cuál de estos experimentos es determinista?",o:["Multiplicar 3 × 4","Lanzar dos dados","Sacar una carta de una baraja","Lanzar una moneda"],h:"Busca el que siempre da lo mismo.",e:"3 × 4 siempre es 12: es determinista."}],
open:[
{q:"Escribe dos ejemplos de experimentos aleatorios y dos de deterministas, diferentes a los de la explicación.",a:"Ejemplos aleatorios: elegir al azar un estudiante de la lista; girar una ruleta. Deterministas: hervir agua; dejar caer un balón. Vale cualquier ejemplo bien clasificado."},
{q:"Explica con tus palabras la diferencia entre un experimento aleatorio y uno determinista.",a:"En el determinista se sabe el resultado antes de hacerlo y siempre es el mismo. En el aleatorio se conocen los resultados posibles, pero no se puede saber cuál va a salir."},
{q:"Clasifica y justifica: a) sacar una carta de una baraja; b) sumar 5 + 7.",a:"a) Aleatorio, porque no se sabe qué carta saldrá. b) Determinista, porque siempre da 12."},
{q:"¿Por qué decimos que el clima de mañana en Neiva es aleatorio?",a:"Porque, aunque se puede pronosticar, no se puede saber con total certeza si va a llover o a hacer sol."}]},
{id:"espacio",name:"Espacio muestral",desc:"El conjunto de todos los resultados posibles de un experimento aleatorio.",
exp:`<h3>¿Qué es?</h3><p>El <b>espacio muestral</b> es el <b>conjunto de todos los resultados posibles</b> de un experimento aleatorio. Se escribe con la letra <b>S</b> (o Ω) y los resultados van <b>entre llaves { }</b>.</p>
<div class="xt"><table><thead><tr><th>Experimento</th><th>Espacio muestral</th><th>N.° de resultados</th></tr></thead><tbody>
<tr><td>Lanzar una moneda</td><td>S = {cara, sello}</td><td>2</td></tr>
<tr><td>Lanzar un dado</td><td>S = {1, 2, 3, 4, 5, 6}</td><td>6</td></tr>
<tr><td>Lanzar dos monedas</td><td>S = {CC, CS, SC, SS}</td><td>4</td></tr>
<tr><td>Sacar una balota roja, azul o verde</td><td>S = {R, A, V}</td><td>3</td></tr>
</tbody></table></div>
<p class="small">C = cara, S = sello.</p>
<div class="tip"><b>Ojo con las dos monedas:</b> CS y SC son resultados <b>diferentes</b>. En CS la primera moneda sale cara; en SC la primera sale sello.</div>`,

{q:"¿Qué es el espacio muestral?",o:["El conjunto de todos los resultados posibles de un experimento aleatorio","El resultado que más se repite","El lugar donde se hace el experimento","El número de veces que se repite un experimento"],h:"Son TODOS los resultados que pueden salir.",e:"Es la lista completa de resultados posibles."},
{q:"¿Cuál es el espacio muestral de lanzar una moneda?",o:["S = {cara, sello}","S = {cara}","S = {1, 2}","S = {cara, sello, canto}"],h:"¿Qué puede salir?",e:"Una moneda puede caer en cara o sello."},
{q:"¿Cuál es el espacio muestral de lanzar un dado?",o:["S = {1, 2, 3, 4, 5, 6}","S = {1, 6}","S = {0, 1, 2, 3, 4, 5, 6}","S = {6}"],h:"El dado tiene 6 caras.",e:"Cada cara del dado es un resultado posible."},
{q:"¿Cuántos resultados tiene el espacio muestral de lanzar dos monedas?",o:["4","2","3","6"],h:"CC, CS, SC, …",e:"S = {CC, CS, SC, SS}: 4 resultados."},
{q:"Completa el espacio muestral de dos monedas: {CC, CS, SC, ___}",o:["SS","CC","CS","SC"],h:"Falta la opción donde ninguna sale cara.",e:"Falta SS (sello y sello)."},
{q:"En una bolsa hay una balota roja, una azul y una verde. ¿Cuál es el espacio muestral al sacar una?",o:["{roja, azul, verde}","{roja}","{roja, azul}","{1, 2, 3, 4}"],h:"¿Qué colores pueden salir?",e:"Puede salir cualquiera de las tres."},

{q:"Al lanzar un dado, ¿cuáles resultados son números pares?",o:["{2, 4, 6}","{1, 3, 5}","{2, 4}","{6}"],h:"Pares: se pueden dividir entre 2.",e:"Los pares del dado son 2, 4 y 6."},
{q:"Si se lanza una moneda y un dado, ¿cuántos resultados tiene el espacio muestral?",o:["12","8","6","2"],h:"Cada cara de la moneda puede ir con 6 números.",e:"2 × 6 = 12 resultados (C1, C2… S6)."},
{q:"Se elige al azar un día de la semana. ¿Cuántos elementos tiene el espacio muestral?",o:["7","5","1","30"],h:"Lunes, martes…",e:"La semana tiene 7 días."}],

{q:"Pedro dice que el espacio muestral de lanzar dos monedas es {CC, CS, SS}. ¿Qué error cometió?",a:"Le falta SC. CS (primera cara, segunda sello) y SC (primera sello, segunda cara) son resultados diferentes. El correcto es {CC, CS, SC, SS}."},

{id:"arbol",name:"Diagrama de árbol",desc:"Dibujar todas las posibilidades con ramas para no olvidar ninguna.",
exp:`<h3>¿Qué es?</h3><p>Es un dibujo con <b>ramas</b> que muestra, en orden, <b>todos los resultados posibles</b> de un experimento. Cada <b>camino completo</b> (de la raíz al final) es <b>un resultado</b>.</p>
<h3>Ejemplo: ¿cómo me visto?</h3><p>Tengo 2 camisetas (blanca, azul) y 2 pantalones (jean, sudadera).</p>
<pre class="tree">blanca ─┬─ jean     → blanca-jean
        └─ sudadera → blanca-sudadera
azul ───┬─ jean     → azul-jean
        └─ sudadera → azul-sudadera</pre>
<p>Hay <b>4 caminos</b>, entonces hay <b>4 combinaciones</b> posibles.</p>
<h3>Pasos</h3><p>1. Pon las opciones de la primera elección. 2. De cada una, saca ramas con las opciones de la segunda elección. 3. Sigue así con cada elección. 4. Cuenta los caminos.</p>
<div class="tip"><b>Truco:</b> cuenta los finales de las ramas. Ese número es el total de resultados posibles.</div>`,
qs:[
{q:"¿Para qué sirve un diagrama de árbol?",o:["Para ver de forma organizada todos los resultados posibles","Para medir la altura de los árboles","Para dibujar figuras geométricas","Para hacer gráficas de barras"],h:"Piensa en las ramas y los caminos.",e:"Organiza todas las posibilidades para no olvidar ninguna."},
{q:"En un diagrama de árbol, ¿qué representa cada camino completo?",o:["Un resultado posible","El total de resultados","Una pregunta","Nada"],h:"De la raíz hasta el final de una rama.",e:"Cada camino es un resultado del experimento."},
{q:"Tienes 2 camisetas y 3 pantalones. ¿Cuántas combinaciones muestra el diagrama de árbol?",o:["6","5","3","9"],h:"De cada camiseta salen 3 ramas.",e:"2 camisetas × 3 pantalones = 6 caminos."},
{q:"Si lanzas una moneda dos veces, ¿cuántos caminos tiene el diagrama de árbol?",o:["4","2","3","8"],h:"De cara salen 2 ramas y de sello otras 2.",e:"CC, CS, SC, SS: 4 caminos."},
{q:"Si lanzas una moneda tres veces, ¿cuántos caminos tiene el diagrama de árbol?",o:["8","6","4","9"],h:"Cada vez que lanzas, las ramas se duplican.",e:"2 × 2 × 2 = 8 caminos."},
{q:"Un restaurante en Neiva ofrece 2 sopas (pollo, verduras) y 3 platos fuertes. ¿Cuántos almuerzos diferentes se pueden armar?",o:["6","5","2","3"],h:"De cada sopa salen 3 ramas.",e:"2 × 3 = 6 almuerzos diferentes."},
{q:"En el diagrama de árbol de lanzar un dado, ¿cuántas ramas salen en el primer nivel?",o:["6","2","1","12"],h:"¿Cuántas caras tiene el dado?",e:"Una rama por cada cara: 6."},
{q:"En el diagrama de lanzar una moneda y luego un dado, ¿cuántas ramas salen de «cara»?",o:["6","2","1","12"],h:"Después de la moneda viene el dado.",e:"De cara salen 6 ramas, una por cada número del dado."},
{q:"En ese mismo diagrama (moneda y luego dado), ¿cuántos resultados hay en total?",o:["12","8","6","2"],h:"6 ramas de cara + 6 ramas de sello.",e:"6 + 6 = 12 resultados."},
{q:"Valentina elige helado de 3 sabores y lo puede pedir en cono o en vaso. ¿Cuántas opciones tiene?",o:["6","5","3","9"],h:"Haz el árbol: sabor y luego recipiente.",e:"3 sabores × 2 recipientes = 6 opciones."},
{q:"¿Qué ventaja tiene el diagrama de árbol?",o:["Permite ver todas las posibilidades sin olvidar ninguna","Da el resultado que va a salir","Elimina los resultados que no gustan","Solo sirve para monedas"],h:"Piensa en el orden y la organización.",e:"Ayuda a listar todas las posibilidades de forma ordenada."}],
open:[
{q:"Tienes 2 camisetas (roja, negra) y 2 gorras (blanca, gris). Escribe todos los caminos del diagrama de árbol.",a:"roja-blanca, roja-gris, negra-blanca, negra-gris. Son 4 combinaciones."},

{q:"Una tienda vende jugo de mango, mora o lulo, en agua o en leche. Escribe todas las opciones usando un diagrama de árbol.",a:"mango-agua, mango-leche, mora-agua, mora-leche, lulo-agua, lulo-leche. Son 6 opciones."},
{q:"Explica cómo se cuenta el total de resultados en un diagrama de árbol.",a:"Se cuentan los caminos completos, es decir, los finales de las últimas ramas. Cada final es un resultado posible."}]},
{id:"multiplicacion",name:"Principio de la multiplicación",desc:"Calcular el total de posibilidades sin tener que escribirlas todas.",
exp:`<h3>La regla</h3><p>Si una elección se puede hacer de <b>m</b> maneras y otra de <b>n</b> maneras, las dos juntas se pueden hacer de <b>m × n</b> maneras. Funciona igual con tres o más elecciones.</p>
<h3>Ejemplos</h3>
<div class="xt"><table><thead><tr><th>Situación</th><th>Cálculo</th><th>Total</th></tr></thead><tbody>
<tr><td>3 camisetas y 4 pantalones</td><td>3 × 4</td><td>12</td></tr>
<tr><td>3 camisetas, 4 pantalones y 2 pares de zapatos</td><td>3 × 4 × 2</td><td>24</td></tr>
<tr><td>Almuerzo: 2 sopas, 3 platos fuertes y 2 jugos</td><td>2 × 3 × 2</td><td>12</td></tr>
<tr><td>Lanzar un dado dos veces</td><td>6 × 6</td><td>36</td></tr>
<tr><td>Candado de 3 dígitos (0 a 9)</td><td>10 × 10 × 10</td><td>1.000</td></tr>
</tbody></table></div>
<h3>Árbol o multiplicación</h3><p>El diagrama de árbol muestra <b>cuáles</b> son los resultados. El principio de la multiplicación dice <b>cuántos</b> son, de forma rápida, sin dibujarlos. Con muchas opciones, el árbol sería enorme: ahí conviene multiplicar.</p>
<div class="tip"><b>Truco:</b> pregúntate cuántas elecciones hay y cuántas opciones tiene cada una. Luego multiplica.</div>`,
qs:[
{q:"¿Qué dice el principio de la multiplicación?",o:["Si una elección se hace de m maneras y otra de n, juntas se hacen de m × n maneras","Que siempre hay que sumar las opciones","Que solo hay un resultado posible","Que hay que dibujar todos los resultados"],h:"El nombre del principio da la pista.",e:"Se multiplica el número de opciones de cada elección."},
{q:"Con 3 camisetas y 4 pantalones, ¿cuántas combinaciones hay?",o:["12","7","34","1"],h:"Multiplica, no sumes.",e:"3 × 4 = 12."},
{q:"Con 3 camisetas, 4 pantalones y 2 pares de zapatos, ¿cuántas formas de vestirse hay?",o:["24","9","12","14"],h:"Multiplica las tres cantidades.",e:"3 × 4 × 2 = 24."},
{q:"Un restaurante ofrece 2 sopas, 3 platos fuertes y 2 jugos. ¿Cuántos menús diferentes hay?",o:["12","7","6","10"],h:"Una elección de cada grupo.",e:"2 × 3 × 2 = 12 menús."},
{q:"Si lanzas una moneda 3 veces, ¿cuántos resultados posibles hay?",o:["8","6","3","9"],h:"Cada lanzamiento tiene 2 opciones.",e:"2 × 2 × 2 = 8."},
{q:"Si lanzas un dado dos veces, ¿cuántos resultados posibles hay?",o:["36","12","6","18"],h:"6 opciones la primera vez y 6 la segunda.",e:"6 × 6 = 36."},
{q:"Un candado tiene 3 ruedas, cada una con los dígitos del 0 al 9. ¿Cuántas claves diferentes hay?",o:["1.000","30","27","999"],h:"Cada rueda tiene 10 opciones.",e:"10 × 10 × 10 = 1.000 claves."},
{q:"De Neiva a Garzón hay 3 rutas y de Garzón a Pitalito hay 2. ¿De cuántas maneras se puede ir de Neiva a Pitalito pasando por Garzón?",o:["6","5","3","2"],h:"Cada ruta del primer tramo se combina con las del segundo.",e:"3 × 2 = 6 maneras."},
{q:"¿Qué ventaja tiene el principio de la multiplicación frente al diagrama de árbol?",o:["Da el total rápido sin tener que dibujar ni escribir todos los resultados","Muestra cuáles son todos los resultados","Siempre da un número más pequeño","No tiene ninguna ventaja"],h:"Piensa en el candado de 1.000 claves.",e:"Permite calcular el total sin listar cada resultado."},
{q:"Al lanzar una moneda y un dado, ¿cuántos resultados posibles hay?",o:["12","8","6","3"],h:"2 opciones por 6 opciones.",e:"2 × 6 = 12."},
{q:"Para la clase de educación física hay 2 sudaderas y 3 camisetas. Si la respuesta de Ana fue «5 combinaciones», ¿qué error cometió?",o:["Sumó en lugar de multiplicar; son 6","Multiplicó en lugar de sumar","No cometió error","Contó de más; son 4"],h:"2 + 3 = 5, pero ¿es la operación correcta?",e:"Se debe multiplicar: 2 × 3 = 6."}],
open:[
{q:"Laura tiene 4 blusas y 3 faldas. ¿De cuántas maneras se puede vestir? Explica cómo lo calculaste.",a:"4 × 3 = 12 maneras. Se multiplica el número de blusas por el número de faldas, porque cada blusa se puede combinar con cada falda."},
{q:"Una heladería ofrece 5 sabores, 2 recipientes (cono o vaso) y 3 coberturas. ¿Cuántos helados diferentes se pueden pedir?",a:"5 × 2 × 3 = 30 helados diferentes."},
{q:"¿Cuántas claves diferentes de 4 dígitos (del 0 al 9) se pueden formar para un celular?",a:"10 × 10 × 10 × 10 = 10.000 claves."},
{q:"¿Cuándo conviene usar el diagrama de árbol y cuándo el principio de la multiplicación?",a:"El árbol conviene cuando hay pocas opciones y se necesita ver cuáles son los resultados. El principio de la multiplicación conviene cuando solo se necesita saber cuántos son o hay muchas opciones."}]}
]},
